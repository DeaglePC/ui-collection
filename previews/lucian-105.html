<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floorplan · Lucian</title>
<!-- Lucian UX/UI Prompt · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/ -->
<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "스튜디오 평면도", "category": "공간·일정·디자인 도구", "summary": "작업실 평면도에서 방을 고르는 배치도입니다. 방을 누르면 그 방이 강조되고 이름과 넓이가 함께 보입니다.", "hint": "방을 하나씩 눌러 보세요", "shape": "square", "fluid": true, "hue": "#3866D5", "hue2": "#3D8BFF", "tags": ["floorplan", "native", "spatial"]} -->

<!-- @en {"title": "Studio floor plan", "summary": "A studio floor plan where you choose a room. The room you press is highlighted along with its name and area.", "hint": "Press the rooms one by one","map":[
  ["촬영실, 24제곱미터, 최대 8명", "Studio, 24 square meters, up to 8 people"],

  ["편집실, 18제곱미터, 최대 6명", "Edit suite, 18 square meters, up to 6 people"],
  ["라운지, 9제곱미터, 최대 3명", "Lounge, 9 square meters, up to 3 people"],
  ["촬영실", "Studio"],
  ["회의실", "Meeting"],
  ["편집실", "Edit suite"],
  ["라운지", "Lounge"],
  ["입구 ↑", "Entrance ↑"]
]} -->
<style>
.u105{width:100%;max-width:400px;min-width:0;font-size:13px}.u105 button{font:inherit;color:inherit;cursor:pointer}.u105 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u105 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u105{padding:14px;border:1px solid var(--ux-line-2);background:var(--ux-surface-2)}.u105 .plan{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:88px 78px 27px;gap:8px;padding:12px;border:3px double var(--ux-ink-2);background:repeating-linear-gradient(0deg,transparent 0 19px,var(--ux-line) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,var(--ux-line) 19px 20px)}.u105 .room{border:2px solid var(--ux-ink-2);border-radius:0;background:var(--ux-surface);font-size:13px;position:relative}.u105 .room:after{content:"";position:absolute;right:6px;bottom:-2px;width:18px;height:12px;border:1px solid var(--ux-ink-2);border-bottom:2px solid var(--ux-surface-2);border-radius:20px 0 0 0}.u105 .room[aria-pressed=true]{background:var(--ux-accent-soft);border-color:var(--ux-accent);color:var(--ux-accent);font-weight:700}.u105 .room small{display:block;font-size:12px;margin-top:7px;font-weight:400}.u105 .entry{grid-column:1/3;font-size:12px;color:var(--ux-ink-2);text-align:center;padding:5px}
</style>
<div class="ux u105"><div class="plan"><button class="room" data-area="24" aria-label="촬영실, 24제곱미터, 최대 8명" aria-pressed="true">촬영실<small>24 m²</small></button><button class="room" data-area="12" aria-label="회의실, 12제곱미터, 최대 4명" aria-pressed="false">회의실<small>12 m²</small></button><button class="room" data-area="18" aria-label="편집실, 18제곱미터, 최대 6명" aria-pressed="false">편집실<small>18 m²</small></button><button class="room" data-area="9" aria-label="라운지, 9제곱미터, 최대 3명" aria-pressed="false">라운지<small>9 m²</small></button><div class="entry">입구 ↑</div></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];qa(".room").forEach(b=>b.onclick=()=>qa(".room").forEach(x=>x.setAttribute("aria-pressed",x===b)));})();
</script>

<script src="./_fit.js"></script>
</body>
</html>
