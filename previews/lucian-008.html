/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{

/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */

  }
}

<!-- @en {"title":"Copy button that turns into a check","summary":"Copies the install command in one go. Press it and the stacked-squares icon is redrawn as a check, a gleam passes over the command, and a “Copied” bubble pops up.","hint":"Press the copy icon on the right, or switch package managers first","map":[

<style>
.u008{position:relative;width:340px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.u008-tabs{display:flex;gap:4px;align-self:flex-start;margin-left:12px}
.u008-tab{height:30px;padding:0 12px;border:0;border-radius:9px;background:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;color:var(--ux-ink-3);transition:background-color .3s var(--ux-ease),color .3s var(--ux-ease)}
.u008-tab[aria-selected="true"]{background:var(--ux-surface);color:var(--ux-ink);box-shadow:0 0 0 1px var(--ux-line)}
.u008-box{position:relative;display:flex;align-items:center;width:316px;height:62px;padding:0 8px 0 18px;border-radius:18px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line-2),0 18px 32px -24px var(--ux-shadow-strong);overflow:visible;transition:box-shadow .45s var(--ux-ease)}
.u008-code{position:relative;flex:1;min-width:0;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14.5px;white-space:nowrap;color:var(--ux-ink)}
.u008-code em{font-style:normal;color:var(--ux-mint);margin-right:8px;user-select:none}
.u008-code b{font-weight:500;color:var(--ux-accent)}
.u008-cmd{display:inline-block}
.u008-code::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--ux-mint) 30%,transparent) 50%,transparent 80%);transform:translateX(-110%);pointer-events:none}
.u008.is-copied .u008-code::after{animation:u008-sweep .7s var(--ux-ease)}
@keyframes u008-sweep{to{transform:translateX(110%)}}
.u008-btn{position:relative;flex:none;width:46px;height:46px;border:0;padding:0;border-radius:13px;background:var(--ux-surface-2);color:var(--ux-ink-2);display:grid;place-items:center;transition:background-color .35s var(--ux-ease),color .35s var(--ux-ease),transform .45s var(--ux-spring)}
.u008-btn:hover{background:var(--ux-surface-3);color:var(--ux-ink)}
.u008-btn:active{transform:scale(.88)}
.u008-btn:focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.u008-btn svg{position:absolute;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s var(--ux-ease),transform .5s var(--ux-spring)}
.u008-ok{opacity:0;transform:scale(.4) rotate(-30deg)}
.u008-ok path{stroke-width:2.6;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .4s var(--ux-ease) .1s}
.u008.is-copied .u008-btn{background:var(--ux-mint);color:var(--ux-accent-ink)}
.u008.is-copied .u008-cp{opacity:0;transform:scale(.4) rotate(30deg)}
.u008.is-copied .u008-ok{opacity:1;transform:none}
.u008.is-copied .u008-ok path{stroke-dashoffset:0}
.u008.is-copied .u008-box{box-shadow:0 0 0 1.5px var(--ux-mint),0 0 0 6px color-mix(in srgb,var(--ux-mint) 16%,transparent),0 18px 32px -24px var(--ux-shadow-strong)}
.u008-tip{position:absolute;right:-6px;top:-44px;padding:7px 12px;border-radius:10px;background:var(--ux-ink);color:var(--ux-page);font-size:13px;font-weight:650;white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(8px) scale(.8);transform-origin:80% 100%;transition:opacity .25s var(--ux-ease),transform .5s var(--ux-spring)}
.u008-tip::after{content:"";position:absolute;right:24px;bottom:-5px;width:10px;height:10px;background:inherit;border-radius:2px;transform:rotate(45deg)}
.u008.is-copied .u008-tip{opacity:1;transform:none}
</style>
<div class="ux u008">
  <div class="u008-tabs" role="tablist" aria-label="패키지 관리자">
    <button class="u008-tab" type="button" role="tab" aria-selected="true" data-cmd="npm i">npm</button>
    <button class="u008-tab" type="button" role="tab" aria-selected="false" data-cmd="pnpm add">pnpm</button>
    <button class="u008-tab" type="button" role="tab" aria-selected="false" data-cmd="bun add">bun</button>
  </div>
  <div class="u008-box">
    <code class="u008-code"><em aria-hidden="true">$</em><span class="u008-cmd">npm i</span> <b>@lucian/motion</b></code>
    <button class="u008-btn" type="button" aria-label="설치 명령어 복사">
      <svg class="u008-cp" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg>
      <svg class="u008-ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg>
    </button>
    <span class="u008-tip" role="status">복사됨</span>
  </div>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var btn = root.querySelector('.u008-btn');
  var cmd = root.querySelector('.u008-cmd');
  var tip = root.querySelector('.u008-tip');
  var tabs = Array.prototype.slice.call(root.querySelectorAll('.u008-tab'));
  var t = 0;
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  tip.textContent = '';
  function text() { return cmd.textContent + ' @lucian/motion'; }
  // 실제 클립보드에 쓰고, 막힌 환경에서도 화면 반응은 똑같이 보여 줍니다
  function write(s) {
    try { if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s).catch(function () {}); } catch (e) { /* 무시 */ }
    return Promise.resolve();
  }
  btn.addEventListener('click', function () {
    write(text());
    clearTimeout(t);
    root.classList.remove('is-copied');
    void root.offsetWidth;
    root.classList.add('is-copied');
    tip.textContent = '복사됨';
    t = setTimeout(function () { if (root.isConnected) { root.classList.remove('is-copied'); tip.textContent = ''; } }, 1800);
  });
  // 패키지 관리자를 바꾸면 명령어가 위에서 내려오며 바뀝니다
  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { select(i); });
    tab.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (d) { e.preventDefault(); var n = (i + d + tabs.length) % tabs.length; select(n); tabs[n].focus(); }
    });
  });
  function select(i) {
    tabs.forEach(function (tb, k) { tb.setAttribute('aria-selected', String(k === i)); tb.tabIndex = k === i ? 0 : -1; });
    cmd.textContent = tabs[i].dataset.cmd;
    if (cmd.animate && !rm) cmd.animate([{ transform: 'translateY(-60%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 360, easing: 'cubic-bezier(.34,1.45,.64,1)' });
  }
  tabs.forEach(function (tb, k) { tb.tabIndex = k === 0 ? 0 : -1; });
})();
</script>
