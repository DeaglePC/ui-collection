<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "예산 안에서 나누는 자원", "category": "분석·데이터", "summary": "12코어를 세 팀이 나눠 쓰는 자원 배분기입니다. 팀별 숫자를 바꾸면 위의 막대가 다시 나뉘고, 남은 용량을 넘지 않도록 최댓값이 함께 조정됩니다.", "hint": "팀 이름 아래 숫자를 바꿔 보세요", "shape": "square", "fluid": true, "hue": "#198B68", "hue2": "#FF6B8B", "tags": ["resource-allocation", "analytics"]} -->
<!-- @demo [["wait", 500], ["set", ".u171 input[data-k=\"0\"]", 0, "5", 1500], ["set", ".u171 input[data-k=\"2\"]", 0, "3", 1500], ["set", ".u171 input[data-k=\"0\"]", 0, "4", 300], ["set", ".u171 input[data-k=\"2\"]", 0, "2", 1000]] -->
<!-- @en {"title": "Capacity budget split", "summary": "A resource allocator for three teams sharing 12 cores. Change a team’s number and the bar above redivides, with each maximum adjusted so the total never goes over.", "hint": "Change the number under a team name","map":[
  ["총 12코어의 자원 배분", "Allocation of 12 cores in total"],
  ["리서치", "Research"],
  ["프로덕트", "Product"],
  ["플랫폼", "Platform"],
  ["${n} 코어 수", "${n} cores"],
  ["${total}/12코어 · 남은 용량 ${12-total}코어", "${total}/12 cores · ${12-total} cores left"]
]} -->
<style>.u171{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u171 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u171 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u171 button:active{transform:scale(.97)}.u171 small{color:var(--ux-ink-2);font-size:12px}.u171 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u171 .status b{color:var(--ux-ink)}.u171 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u171 svg{display:block;width:100%;overflow:visible}.u171 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u171 .gridline{stroke:var(--ux-line-2);fill:none}.u171 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u171 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}.u171 .pool{display:flex;height:60px;border-radius:9px;background:var(--ux-surface-3);overflow:hidden;margin:24px 0 16px}.u171 .pool i{width:calc(var(--n)/12*100%);background:var(--c);transition:width .5s var(--ux-ease)}.u171 .teams{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.u171 .team{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--ux-ink-2)}.u171 input{width:68px;height:44px;border:1px solid var(--ux-line-2);background:var(--ux-surface);border-radius:8px;padding:8px;text-align:center;font-size:18px;color:var(--ux-ink)}.u171 .status{text-align:center}.u171{min-height:0;box-shadow:none}.u171 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u171 .inline{margin-bottom:8px}</style>
<div class="ux u171"><div class="pool" aria-label="총 12코어의 자원 배분"></div><div class="teams"></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),names=['리서치','프로덕트','플랫폼'],colors=['#426F90','#6285A2','#8BA2B3'];let vals=[4,3,2];q('.teams').innerHTML=names.map((n,i)=>`<label class="team"><span>${n}</span><input type="number" min="0" max="12" step="1" value="${vals[i]}" data-k="${i}" aria-label="${n} 코어 수"></label>`).join('');q('.pool').innerHTML=vals.map((v,i)=>`<i style="--n:${v};--c:${colors[i]}"></i>`).join('');function draw(){let total=vals.reduce((a,b)=>a+b,0);root.querySelectorAll('.pool i').forEach((el,i)=>{el.style.setProperty('--n',vals[i])});root.querySelectorAll('input').forEach((el,i)=>{el.value=vals[i];el.max=12-total+vals[i]});q('.status').textContent=`${total}/12코어 · 남은 용량 ${12-total}코어`;root.dataset.state=vals.join(',')}q('.teams').oninput=e=>{let el=e.target;if(el.tagName!=='INPUT')return;let i=+el.dataset.k,remaining=12-vals.reduce((sum,v,j)=>sum+(j===i?0:v),0);vals[i]=Math.max(0,Math.min(remaining,Math.round(+el.value||0)));draw()};draw()})();
</script>

<script src="./_fit.js"></script>
</body>
</html>
