/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;

:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){

<body class="ux">
<!-- @meta {"title": "주차별로 남는 고객 격자", "category": "분석·데이터", "summary": "가입한 주마다 고객이 몇 주 뒤까지 남았는지 칸의 진하기로 보여 주는 코호트 표입니다. 칸을 누르면 그 가입 주와 경과 주의 잔존율이 강조되고, 다시 누르면 선택이 풀립니다.", "hint": "표의 칸을 하나 눌러 보세요", "shape": "square", "fluid": true, "hue": "#198B68", "hue2": "#FF6B8B", "tags": ["cohort-retention", "analytics"]} -->
<!-- @demo [["wait", 600], ["tap", ".u161 .cohort button[data-row=\"0\"][data-col=\"4\"]", 0], ["wait", 1500], ["tap", ".u161 .cohort button[data-row=\"2\"][data-col=\"2\"]", 0], ["wait", 1500], ["tap", ".u161 .cohort button[data-row=\"2\"][data-col=\"2\"]", 0], ["wait", 1000]] -->
<!-- @en {"title": "Weekly retention cohorts", "summary": "A cohort table that shades each cell by how many customers from a signup week were still around weeks later. Press a cell to highlight that retention, and press again to clear it.", "hint": "Press one of the cells","map":[

  ["${labels[j]} 가입, ${i}주 뒤 ${r[i]}% 잔존", "Joined ${labels[j]}, ${r[i]}% retained after ${i} weeks"],

]} -->
<style>.u161{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u161 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u161 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u161 button:active{transform:scale(.97)}.u161 small{color:var(--ux-ink-2);font-size:12px}.u161 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u161 .status b{color:var(--ux-ink)}.u161 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u161 svg{display:block;width:100%;overflow:visible}.u161 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u161 .gridline{stroke:var(--ux-line-2);fill:none}.u161 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u161 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u161{border-radius:12px 12px 30px 12px}.u161 .cohort{display:grid;grid-template-columns:42px repeat(5,1fr);gap:5px;margin-top:20px}.u161 .cohort .label{align-self:center;color:var(--ux-ink-2);font-size:10px}.u161 .cohort .week{text-align:center;min-height:20px;font-size:10px;color:var(--ux-ink-2)}.u161 .cohort button{padding:0;min-height:36px;border:0;border-radius:4px;background:color-mix(in srgb,#24816F calc(var(--v)*1%),var(--ux-surface-3));color:var(--ux-ink);font-size:11px;transition:transform .35s}.u161 .cohort button.high{color:white}.u161 .cohort button[aria-pressed="true"]{outline:2px solid var(--ux-ink);outline-offset:1px;transform:translateY(-2px)}.u161 .status{padding:12px 0;border-top:1px solid var(--ux-line-2);margin-top:20px}.u161{min-height:0;box-shadow:none}.u161 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u161 .inline{margin-bottom:8px}.u161{border-radius:0;background:transparent}.u161 .cohort{margin-top:0;grid-template-columns:42px repeat(5,1fr)}.u161 .cohort .label,.u161 .cohort .week{font-size:12px}.u161 .cohort button{min-height:44px;font-size:12px;background:color-mix(in srgb,var(--ux-mint) calc(var(--v)*.35%),var(--ux-surface));color:var(--ux-ink)}.u161 .cohort button.high{color:var(--ux-ink)}.u161 .status{text-align:center;margin-top:12px}</style>
<div class="ux u161"><div class="cohort" role="group" aria-label="가입 주차별 잔존율"></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const data=[[100,78,64,58,52],[100,82,71,63],[100,85,76],[100,88]],labels=['9/7','9/14','9/21','9/28'];q('.cohort').innerHTML='<span></span>'+[0,1,2,3,4].map(i=>`<span class="week">${i}주</span>`).join('')+data.map((r,j)=>`<span class="label">${labels[j]}</span>`+Array.from({length:5},(_,i)=>r[i]===undefined?'<span></span>':`<button class="${r[i]>=85?'high':''}" data-row="${j}" data-col="${i}" style="--v:${r[i]}" aria-label="${labels[j]} 가입, ${i}주 뒤 ${r[i]}% 잔존">${r[i]}%</button>`).join('')).join('');function choose(r,c){qa('.cohort button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.row===r&&+b.dataset.col===c));q('.status').innerHTML=r<0?'가입 주별 잔존율':`${labels[r]} 가입 · ${c}주 뒤 <b>${data[r][c]}%</b>`;root.dataset.state=r+':'+c}q('.cohort').onclick=e=>{const b=e.target.closest('button');if(b){if(root.dataset.state===b.dataset.row+':'+b.dataset.col)choose(-1,-1);else choose(+b.dataset.row,+b.dataset.col)}};choose(-1,-1);})();
</script>
