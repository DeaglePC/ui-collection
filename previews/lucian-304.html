<script>
(function () {

  var A = [['06236', '서울 강남구 테헤란로 152', '강남파이낸스센터'], ['06164', '서울 강남구 테헤란로 521', '파르나스타워'], ['06142', '서울 강남구 테헤란로 129', '강남N타워'], ['04524', '서울 중구 세종대로 110', '서울특별시청']];

  function mark(el, text, k) {

    var hit = A.filter(function (a) { return (a[1] + a[2]).toLowerCase().indexOf(k.toLowerCase()) >= 0; });
