    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;

/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){

    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

<div class="ux u132"><div class="logic"><label class="rule"><b>구매</b><input data-num type="number" min="0" max="20" value="3" aria-label="구매 횟수 기준"><span>회</span><select data-op aria-label="구매 비교"><option value="gte">이상</option><option value="lte">이하</option></select></label><button data-mode aria-label="조건 연결 연산">AND</button><label class="rule"><b>지역</b><select data-city aria-label="지역"><option>서울</option><option>부산</option></select></label></div><div class="out"><output>2</output>명 일치</div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const records=[['서울',5],['서울',2],['부산',4],['서울',6],['부산',1],['부산',7]];let mode='AND';function render(){const n=+$('[data-num]').value;const count=records.filter(([city,v])=>{const a=$('[data-op]').value==='gte'?v>=n:v<=n,b=city===$('[data-city]').value;return mode==='AND'?a&&b:a||b}).length;$('output').textContent=count;$('[data-mode]').textContent=mode;root.dataset.logicMode=mode}$$('input,select').forEach(i=>i.oninput=render);$('[data-mode]').onclick=()=>{mode=mode==='AND'?'OR':'AND';render();motion($('output'),[{transform:'translateY(5px)'},{transform:'none'}])};render();})();
</script>
