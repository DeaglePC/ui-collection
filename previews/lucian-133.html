<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const units={cm:1,in:2.54,m:100};function render(reverse=false){const a=$('[data-a]'),b=$('[data-b]'),f=$('[data-from]').value,t=$('[data-to]').value,src=reverse?b:a,dst=reverse?a:b;dst.value=+(Number(src.value)*(reverse?units[t]/units[f]:units[f]/units[t])).toFixed(4);motion(dst,[{transform:'translateY(3px)'},{transform:'none'}])}$$('[data-a],[data-from],[data-to]').forEach(i=>i.oninput=()=>render());$('[data-b]').oninput=()=>render(true);render();})();
