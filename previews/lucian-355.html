:root[data-theme="dark"]{
  color-scheme:dark;

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<style>
.u355{position:relative;width:340px;height:330px;display:flex;flex-direction:column;padding:16px;border-radius:28px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 30px 60px -36px var(--ux-shadow-strong);overflow:hidden}
.u355-hd{display:flex;align-items:center;gap:8px}
.u355-tt{flex:1;min-width:0;height:34px;border:0;background:none;font-size:18px;font-weight:850;letter-spacing:-.03em;color:var(--ux-ink);outline:none}
.u355-st{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 6px;border-radius:999px;background:var(--ux-surface-2);font-size:11.5px;font-weight:750;color:var(--ux-ink-2);white-space:nowrap;transition:background-color .3s,color .3s}
.u355-st svg{width:24px;height:20px;overflow:visible}
.u355-cl{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.u355-d{fill:currentColor;opacity:0}
.u355[data-s="saving"] .u355-d{opacity:1;animation:u355-bob .9s ease-in-out infinite}
.u355[data-s="saving"] .u355-d:nth-of-type(2){animation-delay:.15s}
.u355[data-s="saving"] .u355-d:nth-of-type(3){animation-delay:.3s}
@keyframes u355-bob{50%{transform:translateY(-2.5px)}}
.u355-ok{fill:none;stroke:var(--ux-mint);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .35s var(--ux-ease)}
.u355[data-s="saved"] .u355-ok{stroke-dashoffset:0}
.u355-sl{stroke:var(--ux-warn);stroke-width:2;stroke-linecap:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .35s var(--ux-ease)}
.u355[data-s="local"] .u355-sl{stroke-dashoffset:0}
.u355[data-s="local"] .u355-st{background:color-mix(in srgb,var(--ux-warn) 14%,transparent);color:var(--ux-warn)}
.u355-sy{fill:none;stroke:var(--ux-accent);stroke-width:1.8;stroke-linecap:round;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.u355[data-s="sync"] .u355-sy{opacity:1;animation:u355-spin .8s linear infinite}
@keyframes u355-spin{to{transform:rotate(360deg)}}
.u355-ta{flex:1;width:100%;margin-top:8px;padding:12px;border:0;border-radius:14px;background:var(--ux-surface-2);font-size:14.5px;line-height:1.6;color:var(--ux-ink);resize:none;outline:none}
.u355-ta:focus{box-shadow:inset 0 0 0 2px var(--ux-accent)}
.u355-ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.u355-ft span{font-size:12px;font-weight:650;color:var(--ux-ink-3)}
.u355-off{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-size:12.5px;font-weight:700;color:var(--ux-ink-2)}
.u355-off i{position:relative;width:36px;height:22px;border-radius:999px;background:var(--ux-surface-3);transition:background-color .3s}
.u355-off i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .4s var(--ux-spring)}
.u355-off[aria-pressed="true"] i{background:var(--ux-warn)}
.u355-off[aria-pressed="true"] i::after{transform:translateX(14px)}
</style>
<div class="ux u355" data-s="saved">
  <div class="u355-hd">
    <input class="u355-tt" type="text" value="출시 회의" aria-label="제목">
    <span class="u355-st" role="status"><svg viewBox="0 0 24 20" aria-hidden="true"><path class="u355-cl" d="M7 16.5h10.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.4 7.6 4.5 4.5 0 0 0 7 16.5z"/><circle class="u355-d" cx="9" cy="12" r="1.2"/><circle class="u355-d" cx="12.5" cy="12" r="1.2"/><circle class="u355-d" cx="16" cy="12" r="1.2"/><path class="u355-ok" d="M9.3 12l2.2 2.1 4-4.2"/><path class="u355-sl" d="M4 2l17 17"/><path class="u355-sy" d="M15.5 10.5a3.4 3.4 0 1 1-1-2.4M15.5 6.8v1.8h-1.8"/></svg><span class="u355-tx">방금 저장됨</span></span>
  </div>
  <textarea class="u355-ta" aria-label="본문">다음 주 출시 회의 메모.</textarea>
  <div class="u355-ft"><span class="u355-all">모두 저장됨</span><button class="u355-off" type="button" aria-pressed="false"><i aria-hidden="true"></i>오프라인으로 작업</button></div>
</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var tx = root.querySelector('.u355-tx'), ta = root.querySelector('.u355-ta'), tt = root.querySelector('.u355-tt'), off = root.querySelector('.u355-off');
  var offline = false, savedAt = Date.now(), t1 = 0, t2 = 0, dirty = false;
  function state(s, text) { root.setAttribute('data-s', s); tx.textContent = text; }
  function ago() {
    var s = Math.floor((Date.now() - savedAt) / 1000);
    if (s < 10) return '방금 저장됨';
    if (s < 60) return s + '초 전 저장';
    return Math.floor(s / 60) + '분 전 저장';
  }
  // 손을 멈춘 뒤 0.5초 기다렸다 저장을 시작하고, 0.9초 뒤 저장됨으로 바꿉니다
  function edited() {
    clearTimeout(t1); clearTimeout(t2);
    if (offline) { dirty = true; state('local', '기기에 임시 저장'); return; }
    state('saving', '저장 중');
    t1 = setTimeout(function () {
      t2 = setTimeout(function () { if (!root.isConnected) return; savedAt = Date.now(); state('saved', ago()); }, 900);
    }, 500);
  }
  ta.addEventListener('input', edited);
  tt.addEventListener('input', edited);
  off.addEventListener('click', function () {
    offline = !offline;
    off.setAttribute('aria-pressed', String(offline));
    clearTimeout(t1); clearTimeout(t2);
    if (offline) { state('local', '기기에 임시 저장'); return; }
    state('sync', '동기화 중');
    t2 = setTimeout(function () { if (!root.isConnected) return; dirty = false; savedAt = Date.now(); state('saved', ago()); }, 1300);
  });
  var iv = setInterval(function () {
    if (!root.isConnected) { clearInterval(iv); return; }
    if (root.getAttribute('data-s') === 'saved') tx.textContent = ago();
  }, 1000);
})();
</script>
