<style>

.u208-a svg{width:100%;height:100%;display:block;border-radius:24%;box-shadow:0 4px 10px -4px rgba(0,0,0,.35)}
.u208-a::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#3B3355;opacity:0;transition:opacity .2s}
.u208-a.is-run::after{opacity:1}
.u208-a.is-hop{animation:u208-hop .9s cubic-bezier(.3,.6,.4,1) 2}
@keyframes u208-hop{30%{transform:translateY(-22px)}55%{transform:translateY(0)}72%{transform:translateY(-6px)}}
.u208-a:focus-visible{outline:2px solid #3B3355;outline-offset:2px}

    ['#8CE99A', '#2B8A3E', '<path d="M8 22c0-7 7-12 15-12s15 5 15 12-7 12-15 12c-2 0-4 0-6-1l-7 3 2-6c-3-2-4-5-4-8z" fill="#fff"/>'],
