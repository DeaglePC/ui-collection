.u130{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u130 button,.u130 input,.u130 textarea,.u130 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u130 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u130 input,.u130 textarea,.u130 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u130 .quiet{color:var(--ux-ink-2)}.u130 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u130 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u130 [hidden]{display:none!important}.u130 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u130 *{animation:none!important;transition:none!important}}

<div class="ux u130"><div class="map"><span class="source">full_name<small>서윤</small></span><span class="link" aria-hidden="true">→</span><div class="target"><button data-col="name" aria-label="이름 열 매핑" aria-expanded="false">이름</button></div></div><div class="map"><span class="source">mail_addr<small>seoyun@example.com</small></span><span class="link" aria-hidden="true">→</span><div class="target"><button data-col="email" aria-label="이메일 열 매핑" aria-expanded="false">이메일</button></div></div><p class="error" data-error hidden role="status">같은 목표 필드가 중복됐어요</p></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const mapping={name:'name',email:'email'},labels={name:'이름',email:'이메일',ignore:'건너뛰기'};function close(){$$('.choices').forEach(x=>x.remove());$$('[data-col]').forEach(b=>b.setAttribute('aria-expanded','false'))}function render(){const keys=Object.values(mapping).filter(x=>x!=='ignore'),record={};for(const k of Object.keys(mapping))if(mapping[k]!=='ignore')record[mapping[k]]=k==='name'?'서윤':'seoyun@example.com';$('[data-error]').hidden=keys.length===new Set(keys).size;$$('[data-col]').forEach(b=>b.textContent=labels[mapping[b.dataset.col]]);root.dataset.record=JSON.stringify(record)}$$('[data-col]').forEach(b=>b.onclick=()=>{const opened=b.getAttribute('aria-expanded')==='true';close();if(opened)return;b.setAttribute('aria-expanded','true');const menu=document.createElement('div');menu.className='choices';menu.innerHTML=Object.keys(labels).map(k=>'<button data-choice="'+k+'">'+labels[k]+'</button>').join('');b.parentElement.append(menu);menu.querySelectorAll('button').forEach(o=>o.onclick=()=>{mapping[b.dataset.col]=o.dataset.choice;close();render();b.focus();motion(b.closest('.map').querySelector('.link'),[{transform:'translateX(-4px)'},{transform:'none'}])})});root.addEventListener('keydown',e=>{if(e.key==='Escape'){const b=$('[data-col][aria-expanded="true"]');close();b?.focus()}});render();})();
</script>
