<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rich Text · Lucian</title>

<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "선택 문장 서식", "category": "문서·데이터 편집", "summary": "선택한 글자에 굵게·기울임을 적용하고 문단 정렬을 바꾸는 서식 막대입니다. 아무것도 고르지 않으면 문단 전체에 적용되고, 버튼은 현재 서식을 표시합니다.", "hint": "문장을 고르고 굵게나 가운데 정렬 버튼을 눌러 보세요", "shape": "square", "fluid": true, "hue": "#885ACC", "hue2": "#22C3A6", "tags": ["rich-text", "editing", "interactive"]} -->

<style>
.u140{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u140 button,.u140 input,.u140 textarea,.u140 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u140 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u140 input,.u140 textarea,.u140 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u140 .quiet{color:var(--ux-ink-2)}.u140 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u140 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u140 [hidden]{display:none!important}.u140 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u140 *{animation:none!important;transition:none!important}}
.u140{background:var(--ux-surface);border-radius:3px;box-shadow:0 8px 18px var(--ux-shadow);padding:27px 25px 15px}.u140 .editable{font:21px/1.8 Georgia,'Apple SD Gothic Neo',serif;min-height:165px;overflow-wrap:anywhere}.u140 .tools{display:flex;justify-content:flex-end;gap:5px;margin-top:10px;visibility:hidden;opacity:0;transition:opacity .16s}.u140:focus-within .tools{visibility:visible;opacity:1}.u140 .tools button{width:44px;padding:0;border:0;background:var(--ux-surface-2);font:700 16px Georgia,serif}.u140 .tools button[aria-pressed="true"]{background:var(--ux-accent-soft);color:var(--ux-accent)}
</style>
<div class="ux u140"><div class="editable" contenteditable="true" role="textbox" aria-label="서식 편집 문서" aria-multiline="true">작은 씨앗은<br>빛을 향해 자란다.</div><div class="tools" aria-label="문장 서식"><button data-format="bold" aria-label="선택 글자 굵게" aria-pressed="false">B</button><button data-format="italic" aria-label="선택 글자 기울임" aria-pressed="false"><i>I</i></button><button data-align aria-label="가운데 정렬" aria-pressed="false">≡</button></div><span class="sr" data-state aria-live="polite"></span></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const editor=$('.editable');let saved;function selectAll(){editor.focus();const r=document.createRange();r.selectNodeContents(editor);const s=getSelection();s.removeAllRanges();s.addRange(r);saved=r.cloneRange()}document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&editor.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange()});$$('[data-format]').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>{editor.focus();if(!saved||saved.collapsed)selectAll();else{const s=getSelection();s.removeAllRanges();s.addRange(saved)}document.execCommand(b.dataset.format);b.setAttribute('aria-pressed',String(document.queryCommandState(b.dataset.format)));$('[data-state]').textContent='서식 적용됨';motion(editor,[{transform:'translateY(2px)'},{transform:'none'}])}});$('[data-align]').onclick=()=>{const center=editor.style.textAlign!=='center';editor.style.textAlign=center?'center':'left';$('[data-align]').setAttribute('aria-pressed',String(center));$('[data-align]').setAttribute('aria-label',center?'왼쪽 정렬':'가운데 정렬');editor.focus()};})();
</script>
