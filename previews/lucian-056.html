<style>

.u056-ring{position:absolute;left:0;right:0;top:0;height:var(--h,108px);border-radius:22px;box-shadow:0 0 0 2px var(--ux-accent),0 18px 34px -22px var(--ux-accent);transform:translateY(var(--y,0));transition:transform .55s var(--ux-spring),height .4s;pointer-events:none;z-index:1}
.u056-p{position:relative;display:flex;align-items:center;gap:12px;min-height:108px;padding:16px 18px;border-radius:22px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line);cursor:pointer;text-align:left;transition:transform .35s var(--ux-spring)}

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var sw = root.querySelector('.u056-sw'), knob = root.querySelector('.u056-knob'), opts = sw.querySelectorAll('button');
  var badge = root.querySelector('.u056-badge'), ring = root.querySelector('.u056-ring');
  var labels = root.querySelectorAll('.u056-p'), radios = root.querySelectorAll('.u056-p input');
  var ods = root.querySelectorAll('.u056-od'), notes = root.querySelectorAll('.u056-pr small');
  var feat = root.querySelector('.u056-feat'), cta = root.querySelector('.u056-cta');
  var P = [
    { n: '베이직', m: 9900, y: 8250, f: ['프로젝트 3개', '기본 템플릿 40종', '7일 버전 기록'] },
    { n: '프로', m: 19900, y: 16580, f: ['프로젝트 무제한', '팀원 10명까지 초대', '무제한 버전 기록', '우선 지원'] }
  ];
  var yearly = false, plan = 1;
  var uid = 'u056' + Math.random().toString(36).slice(2, 7);
  radios.forEach(function (r) { r.name = uid; });
  // 자리마다 0–9 칸을 쌓아 두고, 바뀐 자리만 굴립니다. 자리마다 조금씩 늦게 움직입니다
  function od(el, v) {
    var s = '₩' + v.toLocaleString('ko-KR');
    if (el.getAttribute('data-len') !== String(s.length)) {
      el.setAttribute('data-len', s.length);
      el.innerHTML = s.split('').map(function (ch, k) {
        if (ch < '0' || ch > '9') return '<span>' + ch + '</span>';
        var c = ''; for (var i = 0; i < 10; i++) c += '<span>' + i + '</span>';
        return '<span class="u056-col" style="--d:' + ch + ';--k:' + k + '">' + c + '</span>';
      }).join('');
    } else {
      var cols = el.querySelectorAll('.u056-col'), dg = s.replace(/\D/g, '');
      cols.forEach(function (c, i) { c.style.setProperty('--d', dg[i]); });
    }
    el.setAttribute('aria-label', s + ' 월');
    el.setAttribute('role', 'text');
  }
  function prices() {
    ods.forEach(function (el, i) { od(el, yearly ? P[i].y : P[i].m); });
    notes.forEach(function (n, i) { n.textContent = yearly ? '/ 월 · 연 ₩' + (P[i].y * 12).toLocaleString('ko-KR') : '/ 월'; });
  }
  function place() {
    var o = opts[yearly ? 1 : 0], l = labels[plan];
    knob.style.setProperty('--x', (o.offsetLeft - 4) + 'px');
    knob.style.setProperty('--w', o.offsetWidth + 'px');
    ring.style.setProperty('--y', l.offsetTop + 'px');
    ring.style.setProperty('--h', l.offsetHeight + 'px');
  }
  function setCycle(y, focus) {
    yearly = y;
    opts.forEach(function (o, k) { o.setAttribute('aria-checked', String(k === (y ? 1 : 0))); o.tabIndex = k === (y ? 1 : 0) ? 0 : -1; });
    place();
    if (focus) opts[y ? 1 : 0].focus();
    if (y) { badge.classList.remove('wig'); void badge.offsetWidth; badge.classList.add('wig'); }
    prices();
  }
  function setPlan(i) {
    plan = i;
    place();
    feat.innerHTML = P[i].f.map(function (t, k) { return '<li style="--i:' + k + '"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.4l3.2 3.2L14 5.6"/></svg>' + t + '</li>'; }).join('');
    cta.textContent = P[i].n + ' 시작하기';
  }
  opts.forEach(function (o, k) {
    o.addEventListener('click', function () { setCycle(k === 1); });
    o.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setCycle(!yearly, true); }
    });
  });
  radios.forEach(function (r, i) { r.addEventListener('change', function () { setPlan(i); }); });
  badge.addEventListener('animationend', function () { badge.classList.remove('wig'); });
  setCycle(false);
  setPlan(1);
  if (window.ResizeObserver) new ResizeObserver(place).observe(root);
})();
</script>
