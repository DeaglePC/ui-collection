<style>

.u400-sw:focus-visible{outline:2px solid #6366F1;outline-offset:3px;border-radius:9px}
.u400-dt{position:absolute;left:18px;top:42px;font-size:11px;font-weight:850;color:var(--ux-ink-2);font-variant-numeric:tabular-nums}
.u400-sv{position:absolute;left:0;top:0;width:300px;height:480px;pointer-events:none}
.u400-nm{font-size:10.5px;font-weight:800;fill:var(--ux-ink-2)}
.u400-v{font-size:14px;font-weight:900;fill:var(--ux-ink);text-anchor:end;font-variant-numeric:tabular-nums}
.u400-dl{font-size:10px;font-weight:850;text-anchor:end;font-variant-numeric:tabular-nums;transition:opacity .25s}

.u400-dot{stroke:var(--ux-surface);stroke-width:2;opacity:0;transition:opacity .15s}
.u400.is-hov .u400-xh{opacity:.5}
.u400.is-hov .u400-dot{opacity:1}
.u400-tk{font-size:8.5px;font-weight:700;fill:var(--ux-ink-3);text-anchor:middle;font-variant-numeric:tabular-nums}
.u400-ov{position:absolute;left:12px;right:12px;top:70px;height:356px;cursor:crosshair;touch-action:pan-y;border-radius:12px}

<script>
