<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro · Lucian</title>
<!-- Lucian UX/UI Prompt · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/ -->
<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "환승 노선 선택", "category": "공간·일정·디자인 도구", "summary": "직통과 환승 두 경로를 노선도 위에서 비교합니다. 경로를 고르면 해당 구간이 진하게 바뀌고 소요 시간이 강조됩니다.", "hint": "아래 두 경로 버튼을 번갈아 눌러 보세요", "shape": "square", "fluid": true, "hue": "#16846D", "hue2": "#3D8BFF", "tags": ["metro", "native", "spatial"]} -->

<style>
.u107{width:100%;max-width:400px;min-width:0;font-size:13px}.u107 button{font:inherit;color:inherit;cursor:pointer}.u107 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u107 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u107 .map{height:200px;background:var(--ux-surface-2);border-radius:22px 4px;overflow:hidden}.u107 svg{width:100%;height:100%}.u107 .route{fill:none;stroke:#378a96;stroke-width:8;stroke-linecap:round;transition:opacity .3s}.u107 .alt{stroke:#bd8750;opacity:.2}.u107[data-route=alt] .alt{opacity:1}.u107[data-route=alt] .main{opacity:.2}.u107 circle{fill:var(--ux-surface);stroke:var(--ux-ink-2);stroke-width:2.5}.u107 svg text{fill:var(--ux-ink);font-size:12px;font-weight:600}.u107 .options{display:flex;justify-content:center;gap:8px;margin-top:14px}.u107 .options button{padding:10px 13px;min-height:44px;border:1px solid var(--ux-line-2);border-radius:24px;background:transparent;font-size:13px}.u107 .options button[aria-pressed=true]{border-color:var(--ux-accent);color:var(--ux-accent);background:var(--ux-accent-soft)}
</style>
<div class="ux u107"><div class="map"><svg viewBox="0 0 360 180" role="img" aria-label="중앙, 광장, 정원, 항구, 해안 역 노선"><path class="route main" d="M30 130H130L210 55H330"/><path class="route alt" d="M30 130L105 45H175L250 130H330V55"/><g><circle cx="30" cy="130" r="7"/><circle cx="130" cy="130" r="7"/><circle cx="210" cy="55" r="7"/><circle cx="105" cy="45" r="7"/><circle cx="250" cy="130" r="7"/><circle cx="330" cy="55" r="7"/></g><text x="18" y="153">중앙</text><text x="116" y="153">광장</text><text x="191" y="34">정원</text><text x="89" y="25">미술관</text><text x="236" y="154">항구</text><text x="312" y="34">해안</text></svg></div><div class="options"><button data-route="main" aria-pressed="true">직통 · 18분</button><button data-route="alt" aria-pressed="false">환승 · 24분</button></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];function select(r){root.dataset.route=r;qa(".options button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.route===r))}qa(".options button").forEach(b=>b.onclick=()=>select(b.dataset.route));})();
</script>

<script src="./_fit.js"></script>
</body>
</html>
