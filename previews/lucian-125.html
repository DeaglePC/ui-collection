<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{

  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;

  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);

  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){

    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);

}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<body class="ux">
<!-- @meta {"title": "스냅 정렬 가이드", "category": "공간·일정·디자인 도구", "summary": "도형을 옮길 때 가운데 가이드에 달라붙는 정렬 캔버스입니다. 중앙 가까이 가면 가이드선이 나타나며 정확히 맞춰지고, Enter로 바로 중앙에 둘 수도 있습니다.", "hint": "도형을 끌어 가운데로 가져가 보세요. 방향키로 옮기고 Enter로 중앙 정렬합니다", "shape": "square", "fluid": true, "hue": "#3866D5", "hue2": "#3D8BFF", "tags": ["snapping", "native", "spatial"]} -->
<!-- @demo [["wait", 500], ["key", ".u125 .object", 0, "ArrowRight", 3, 260], ["wait", 500], ["key", ".u125 .object", 0, "Enter", 1, 1300], ["key", ".u125 .object", 0, "Escape", 1, 1000]] -->
<!-- @en {"title": "Snap guides", "summary": "A canvas where a shape snaps to the center guides as you move it. Near the middle a guide line appears and locks it in place; Enter centers it right away.", "hint": "Drag the shape toward the middle. Arrow keys move it and Enter centers it","map":[
  ["스냅 정렬 영역", "Snap area"],
  ["', 중앙 정렬'", "', centered'"],
  ["도형 위치 ", "Shape position "],
  [", 방향키로 이동, Enter로 중앙 정렬", ", move with arrow keys, Enter to center"]
]} -->
<style>
.u125{width:100%;max-width:400px;min-width:0;font-size:13px}.u125 button{font:inherit;color:inherit;cursor:pointer}.u125 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u125 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u125 .canvas{height:250px;position:relative;background:var(--ux-surface-2);border:1px solid var(--ux-line-2);border-radius:4px;overflow:hidden;background-image:radial-gradient(var(--ux-line-2) 1px,transparent 1px);background-size:20px 20px}.u125 .vline{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--ux-accent);opacity:0}.u125 .hline{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ux-accent);opacity:0}.u125 .object{position:absolute;width:74px;height:64px;left:calc(var(--x,30%) - 37px);top:calc(var(--y,40%) - 32px);background:#aa8260;border:1px solid #8b6646;border-radius:7px;cursor:grab;touch-action:none;transition:left .15s,top .15s}.u125 .object.drag{cursor:grabbing;transition:none}.u125 .object:after{content:"";position:absolute;inset:-5px;border:1px solid var(--ux-accent);border-radius:3px}.u125 .canvas.snapx .vline,.u125 .canvas.snapy .hline{opacity:1}
</style>
<div class="ux u125"><div class="canvas" aria-label="스냅 정렬 영역"><span class="vline"></span><span class="hline"></span><button class="object" aria-label="도형 위치 X 30%, Y 40%, 방향키로 이동, Enter로 중앙 정렬"></button></div><output class="sr" aria-live="polite"></output></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let x=30,y=40;const snap=v=>Math.abs(v-50)<=3?50:v;function paint(){x=Math.max(15,Math.min(85,snap(x)));y=Math.max(15,Math.min(85,snap(y)));root.style.setProperty('--x',x+'%');root.style.setProperty('--y',y+'%');q('.canvas').classList.toggle('snapx',x===50);q('.canvas').classList.toggle('snapy',y===50);const text=`X ${Math.round(x)}%, Y ${Math.round(y)}%${x===50&&y===50?', 중앙 정렬':''}`;q('output').textContent=text;q('.object').setAttribute('aria-label','도형 위치 '+text+', 방향키로 이동, Enter로 중앙 정렬')}q('.object').onkeydown=e=>{let d={ArrowLeft:[-5,0],ArrowRight:[5,0],ArrowUp:[0,-5],ArrowDown:[0,5]}[e.key];if(d){e.preventDefault();x+=d[0];y+=d[1];paint()}if(e.key==='Enter'){e.preventDefault();x=50;y=50;paint()}if(e.key==='Escape'){x=30;y=40;paint()}};q('.object').onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.classList.add('drag')};q('.object').onpointermove=e=>{if(e.currentTarget.hasPointerCapture(e.pointerId)){const r=q('.canvas').getBoundingClientRect();x=(e.clientX-r.left)/r.width*100;y=(e.clientY-r.top)/r.height*100;paint()}};q('.object').onpointerup=e=>e.currentTarget.classList.remove('drag');q('.object').onpointercancel=e=>e.currentTarget.classList.remove('drag');paint();})();
</script>
