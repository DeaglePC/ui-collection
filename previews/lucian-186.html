<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var rd = root.querySelector('.u186-rd'), sw = root.querySelector('.u186-sw'), ln = root.querySelector('.u186-ln'), sc = root.querySelector('.u186-sc'), st = root.querySelector('.u186-ft p');

  var DEV = [['키보드', 300, 0.66, 'kb'], ['헤드폰', 42, 0.52, 'hp'], ['스피커', 128, 0.74, 'sp'], ['워치', 218, 0.42, 'wt']];
  var ICON = {
    kb: '<rect x="2" y="6" width="18" height="11" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 13.5h8"/>',

    wt: '<rect x="6" y="6" width="10" height="10" rx="3"/><path d="M8.5 6 9 2.5h4l.5 3.5M8.5 16 9 19.5h4l.5-3.5M11 9v2.5l1.5 1"/>'
  };

    b.querySelector('span').textContent = d[0];

  }
