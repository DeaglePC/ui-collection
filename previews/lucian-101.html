<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "분할 작업창", "category": "공간·일정·디자인 도구", "summary": "문서와 표지 미리보기를 나란히 둔 분할 화면입니다. 가운데 경계를 끌면 두 칸의 폭이 바뀌고, 키보드로도 같은 폭을 조절할 수 있습니다.", "hint": "가운데 경계를 좌우로 끌어 보세요. 경계에 초점을 두고 ←/→로도 조절하고, Esc로 처음 폭으로 돌아갑니다", "shape": "square", "fluid": true, "hue": "#C16235", "hue2": "#3D8BFF", "tags": ["split-pane", "native", "spatial"]} -->

<!-- @en {"title": "Split workspace", "summary": "A split view with a document beside its cover preview. Drag the divider to resize both panes, or set the same widths from the keyboard.", "hint": "Drag the divider left and right. With it focused, ←/→ adjust it too, and Esc restores the original width","map":[

]} -->
<style>
.u101{width:100%;max-width:400px;min-width:0;font-size:13px}.u101 button{font:inherit;color:inherit;cursor:pointer}.u101 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u101 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u101{border:1px solid var(--ux-line-2);border-radius:10px;overflow:hidden;background:var(--ux-surface)}.u101 .panes{display:grid;grid-template-columns:minmax(0,var(--split,42%)) 24px minmax(0,1fr);height:230px}.u101 .doc{padding:27px 15px;background:var(--ux-surface-2);overflow:hidden}.u101 h3{margin:0 0 16px;font:500 21px/1.3 Georgia,serif;letter-spacing:-.05em}.u101 p{font-size:13px;line-height:1.8;margin:0}.u101 .sep{padding:0;border:0;background:var(--ux-surface-3);cursor:col-resize;touch-action:none;color:var(--ux-ink-2);font-size:24px}.u101 .preview{padding:25px 16px}.u101 .poster{height:180px;border-radius:90px 90px 5px 5px;background:linear-gradient(150deg,#edc170,#bf6f58);position:relative;overflow:hidden}.u101 .poster:after{content:"";position:absolute;width:110px;height:110px;background:#384563;border-radius:50%;left:25%;top:70px}
</style>
<div class="ux u101"><div class="panes"><section class="doc"><h3>도시와<br>빛 사이</h3><p>해가 낮아지면<br>골목의 색이 달라진다.</p></section><button class="sep" role="separator" aria-label="문서 폭, 방향키로 조절" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="65" aria-valuenow="42">⋮</button><section class="preview"><div class="poster" aria-label="표지 미리보기"></div></section></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let v=42;const set=x=>{v=Math.max(25,Math.min(65,Math.round(x)));root.style.setProperty("--split",v+"%");q(".sep").setAttribute("aria-valuenow",v)};q(".sep").onkeydown=e=>{if(["ArrowLeft","ArrowRight","Home","End","Escape"].includes(e.key)){e.preventDefault();set(e.key==="Escape"?42:e.key==="Home"?25:e.key==="End"?65:v+(e.key==="ArrowRight"?3:-3))}};q(".sep").onpointerdown=e=>e.currentTarget.setPointerCapture(e.pointerId);q(".sep").onpointermove=e=>{if(e.currentTarget.hasPointerCapture(e.pointerId)){const b=q(".panes").getBoundingClientRect();set((e.clientX-b.left)/b.width*100)}};})();
</script>

</body>
