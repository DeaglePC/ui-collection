<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);

  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>

<body class="ux">
<!-- @meta {"title": "증감을 잇는 손익 다리", "category": "분석·데이터", "summary": "시작 값에서 매출과 비용이 더해지고 빠지며 합계에 이르는 과정을 이은 폭포 차트입니다. ‘비용 포함’을 끄면 비용 막대가 흐려지고 합계가 다시 계산됩니다.", "hint": "오른쪽 위 ‘비용 포함’ 버튼을 눌러 보세요", "shape": "square", "fluid": true, "hue": "#B4598E", "hue2": "#FF6B8B", "tags": ["waterfall-breakdown", "analytics"]} -->

<style>.u158{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u158 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u158 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u158 button:active{transform:scale(.97)}.u158 small{color:var(--ux-ink-2);font-size:12px}.u158 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u158 .status b{color:var(--ux-ink)}.u158 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u158 svg{display:block;width:100%;overflow:visible}.u158 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u158 .gridline{stroke:var(--ux-line-2);fill:none}.u158 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u158 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u158{border-radius:8px;border:1px solid var(--ux-line-2);box-shadow:7px 7px 0 var(--ux-surface-3)}.u158 .ledger{display:flex;align-items:start;height:184px;gap:10px;padding-top:20px;margin-top:10px;border-bottom:1px solid var(--ux-line-2)}.u158 .step{position:relative;flex:1;height:140px}.u158 .brick{position:absolute;width:100%;background:var(--ux-mint);bottom:calc(var(--start)*1px);height:calc(var(--size)*1px);border-radius:3px;transition:height .6s,bottom .6s,opacity .4s}.u158 .step.negative .brick{background:var(--ux-danger)}.u158 .step.total .brick{background:var(--ux-accent)}.u158 .brick b{display:block;text-align:center;font-size:10px;position:absolute;top:-18px;left:0;right:0;color:var(--ux-ink)}.u158 .step small{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:10px;white-space:nowrap}.u158 .step::after{content:"";height:1px;position:absolute;width:calc(100% + 10px);left:0;bottom:calc((var(--start) + var(--size))*1px);background:var(--ux-line-2);z-index:0}.u158 .step.total::after{display:none}.u158{min-height:0;box-shadow:none}.u158 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u158 .inline{margin-bottom:8px}.u158{background:transparent;border:0;box-shadow:none;border-radius:0}.u158 .ledger{margin-top:0;height:170px}.u158 .brick b,.u158 .step small{font-size:12px}.u158 .step.total .brick{background:var(--ux-ink-2)}.u158 .cost{border:0;background:var(--ux-surface-3)}.u158 .status{text-align:right}</style>
<div class="ux u158"><div class="inline"><small>단위 · 만 원</small><button class="cost" aria-pressed="true">비용 포함</button></div><div class="ledger"><div class="step" style="--start:0;--size:80"><div class="brick"><b>80</b></div><small>기초</small></div><div class="step" style="--start:80;--size:40"><div class="brick"><b>+40</b></div><small>매출</small></div><div class="step negative" style="--start:90;--size:30"><div class="brick"><b>−30</b></div><small>원가</small></div><div class="step negative" style="--start:75;--size:15"><div class="brick"><b>−15</b></div><small>운영</small></div><div class="step total" style="--start:0;--size:75"><div class="brick"><b>75</b></div><small>합계</small></div></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let costs=true;function draw(){q('.cost').setAttribute('aria-pressed',costs);q('.cost').textContent=costs?'비용 포함':'비용 제외';qa('.negative').forEach(x=>x.style.opacity=costs?1:.18);q('.total').style.setProperty('--size',costs?75:120);q('.total b').textContent=costs?75:120;q('.status').innerHTML=`합계 <b>${costs?75:120}만 원</b>`;root.dataset.state=String(costs)}q('.cost').onclick=()=>{costs=!costs;draw()};draw();})();
</script>
