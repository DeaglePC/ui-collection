<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);

}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<body class="ux">
<!-- @meta {"title": "극장 좌석 배치", "category": "공간·일정·디자인 도구", "summary": "예매 화면의 좌석 배치도입니다. 빈 좌석을 누르면 선택되고 다시 누르면 취소되며, 고른 좌석과 합계 금액이 아래에 표시됩니다.", "hint": "빈 좌석을 눌러 고르고, 다시 눌러 취소해 보세요. 예약된 좌석(×)은 고를 수 없습니다", "shape": "square", "fluid": true, "hue": "#C16235", "hue2": "#3D8BFF", "tags": ["seat-map", "native", "spatial"]} -->
<!-- @demo [["wait", 500], ["tap", ".u106 [data-seat=\"C4\"]", 0], ["wait", 500], ["tap", ".u106 [data-seat=\"C5\"]", 0], ["wait", 1300], ["tap", ".u106 [data-seat=\"C4\"]", 0], ["wait", 400], ["tap", ".u106 [data-seat=\"C5\"]", 0], ["wait", 900]] -->
<!-- @en {"title": "Theater seat map", "summary": "A seat map from a ticketing screen. Press an open seat to select it and press again to release it; your seats and the total appear below.", "hint": "Press open seats to pick them, and press again to release them. Booked seats (×) can’t be chosen","map":[
  ["스크린", "Screen"],
  ["'예약됨':'좌석'", "'booked':'available'"],
  ["(chosen.size*12000).toLocaleString('ko-KR')+'원'", "'$'+(chosen.size*12)"]
]} -->
<style>
.u106{width:100%;max-width:400px;min-width:0;font-size:13px}.u106 button{font:inherit;color:inherit;cursor:pointer}.u106 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u106 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u106{max-width:360px;padding:10px 9px}.u106 .screen{height:28px;border-top:4px solid var(--ux-ink-3);border-radius:60% 60% 0 0;margin:0 25px 14px}.u106 .seats{display:grid;grid-template-columns:18px repeat(6,1fr);gap:6px}.u106 .seat{min-height:38px;padding:0;border:1px solid var(--ux-line-2);border-radius:7px 7px 3px 3px;background:var(--ux-surface-3);font-size:12px;border-bottom:4px solid var(--ux-line-2)}.u106 .seat[aria-pressed=true]{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:var(--ux-accent)}.u106 .seat:disabled{background:var(--ux-line);color:var(--ux-ink-3);cursor:default}.u106 .row{align-self:center;font-size:12px;color:var(--ux-ink-2)}.u106 output{display:block;text-align:center;font-size:13px;min-height:25px;margin-top:18px;color:var(--ux-ink-2)}
</style>
<div class="ux u106"><div class="screen" aria-label="스크린"></div><div class="seats"></div><output aria-live="polite">—</output></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const taken=['A3','B4','B5','C2','D6'];let chosen=new Set();q('.seats').innerHTML=['A','B','C','D'].map(r=>`<span class="row">${r}</span>`+Array.from({length:6},(_,i)=>{const s=r+(i+1);return `<button class="seat" data-seat="${s}" aria-label="${s} ${taken.includes(s)?'예약됨':'좌석'}" aria-pressed="false" ${taken.includes(s)?'disabled':''}>${taken.includes(s)?'×':i+1}</button>`}).join('')).join('');function paint(){qa('.seat').forEach(b=>b.setAttribute('aria-pressed',chosen.has(b.dataset.seat)));q('output').textContent=chosen.size?[...chosen].sort().join(' · ')+' / '+(chosen.size*12000).toLocaleString('ko-KR')+'원':'—'}qa('.seat:not(:disabled)').forEach(b=>b.onclick=()=>{const s=b.dataset.seat;chosen.has(s)?chosen.delete(s):chosen.add(s);paint()});root.onkeydown=e=>{if(e.key==='Escape'){chosen.clear();paint()}};})();
</script>

<script src="./_fit.js"></script>
</body>
