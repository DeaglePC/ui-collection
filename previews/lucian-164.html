<!-- @meta {"title": "구간을 다시 묶는 분포", "category": "분석·데이터", "summary": "응답 시간 표본을 구간으로 묶어 보여 주는 히스토그램입니다. 구간 개수를 바꾸면 막대가 다시 묶이고, 가장 많이 몰린 구간이 표시됩니다.", "hint": "4·8·12 구간 버튼을 번갈아 눌러 보세요", "shape": "square", "fluid": true, "hue": "#CD6E39", "hue2": "#FF6B8B", "tags": ["histogram-rebin", "analytics"]} -->
<!-- @demo [["wait", 600], ["tap", ".u164 button[data-n=\"8\"]", 0], ["wait", 1500], ["tap", ".u164 button[data-n=\"12\"]", 0], ["wait", 1500], ["tap", ".u164 button[data-n=\"4\"]", 0], ["wait", 1100]] -->
<!-- @en {"title": "Rebinning histogram", "summary": "A histogram that groups response-time samples into bins. Change the number of bins and the bars regroup, with the busiest range called out.", "hint": "Switch between the 4, 8 and 12 bin buttons","map":[

]} -->
<style>.u164{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u164 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u164 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u164 button:active{transform:scale(.97)}.u164 small{color:var(--ux-ink-2);font-size:12px}.u164 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u164 .status b{color:var(--ux-ink)}.u164 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u164 svg{display:block;width:100%;overflow:visible}.u164 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u164 .gridline{stroke:var(--ux-line-2);fill:none}.u164 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u164 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u164{border-radius:20px;border-bottom:5px solid #B0754A}.u164 .hist{height:170px;display:flex;align-items:end;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--ux-line-2)}.u164 .bin{flex:1;position:relative;height:100%;display:flex;align-items:end}.u164 .bar{height:var(--height);background:linear-gradient(#B78157,#805C9B);width:100%;border-radius:5px 5px 0 0;animation:u164-grow .5s var(--ux-ease);transform-origin:50% 100%;position:relative}.u164 .bar b{position:absolute;top:-19px;width:100%;text-align:center;font-size:10px;color:var(--ux-ink)}.u164 .axis{display:flex;justify-content:space-between;color:var(--ux-ink-2);margin-top:9px}.u164 .controls{justify-content:center}@keyframes u164-grow{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.u164{min-height:0;box-shadow:none}.u164 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u164 .inline{margin-bottom:8px}.u164{border:0;background:transparent;border-radius:0}.u164 .hist{margin-top:0;height:155px}.u164 .bar{background:#A98261}.u164 .bar b{font-size:12px}.u164 .controls button{border:0;background:transparent}.u164 .controls button[aria-pressed="true"]{background:var(--ux-surface-3)}.u164 .status{text-align:center}</style>
<div class="ux u164"><div class="hist" aria-label="응답 시간 분포"></div><div class="axis"><small>0 ms</small><small>100 ms</small></div><div class="controls" role="group" aria-label="히스토그램 구간 개수"><button data-n="4" aria-pressed="true">4 구간</button><button data-n="8">8 구간</button><button data-n="12">12 구간</button></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const samples=Array.from({length:64},(_,i)=>Math.min(99,Math.round(((i*17)%31+(i*7)%47)/.77)));let n=4;function draw(){let bins=Array(n).fill(0);samples.forEach(v=>bins[Math.min(n-1,Math.floor(v/100*n))]++);const max=Math.max(...bins),top=bins.indexOf(max);q('.hist').innerHTML=bins.map((v,i)=>`<div class="bin" title="${Math.round(i*100/n)}–${Math.round((i+1)*100/n)}ms ${v}개"><div class="bar" style="--height:${v/max*130}px"><b>${v}</b></div></div>`).join('');qa('[data-n]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.n===n));q('.status').innerHTML=`최빈 ${Math.round(top*100/n)}–${Math.round((top+1)*100/n)} ms · ${max}개`;root.dataset.state=String(n)}qa('[data-n]').forEach(b=>b.onclick=()=>{n=+b.dataset.n;draw()});draw();})();
</script>
