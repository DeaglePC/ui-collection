<style>
.u190 {width:100%;max-width:370px;font-size:14px;line-height:1.45;position:relative;--a:#cd5339;--soft:color-mix(in srgb,var(--a) 12%,var(--ux-surface));font-variant-numeric:tabular-nums}

.u190 .outbox{border-left:1px solid var(--ux-line-2);padding-left:22px;margin:18px 0 16px;position:relative}.u190 .time{font:12px ui-monospace;color:var(--ux-ink-2);margin-bottom:13px;display:block}.u190 .mail{padding:18px;border:1px solid var(--ux-line-2);border-radius:3px 12px 12px 3px;background:var(--ux-surface);position:relative;transition:transform .5s,opacity .5s}.u190 .mail::before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ux-accent);left:-28px;top:21px;box-shadow:0 0 0 5px var(--ux-page)}.u190 .mail b{font-size:17px;display:block;margin-bottom:7px}.u190 .stamp{display:inline-block;margin-top:10px;font:10px ui-monospace;border:1px solid var(--ux-line-2);padding:3px 6px;border-radius:4px;color:var(--ux-ink-2)}.u190.sent .mail{transform:translateX(8px);opacity:.55}.u190 .schedule{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.u190 .schedule label{font-size:11px;color:var(--ux-ink-2)}.u190 .schedule input{width:138px}.u190 .schedule button{font-size:11px;padding:7px 10px}.u190 .actions button{flex:1;font-size:12px}.u190 .status{font-size:12px;min-height:20px;color:var(--ux-ink-2);margin-top:14px}

<div class="ux u190" data-state="initial"><div class="mail"><details class="schedule"><summary class="time">오늘 · 14:30 ⌄</summary><div class="schedule-edit"><input aria-label="예약 시간" type="time" value="14:30"><button class="reschedule">변경</button></div></details><b>금요일 디자인 리뷰</b><div class="mail-bottom"><span class="recipient">design@example.com</span><button class="send" aria-label="지금 발송 시연">↗</button></div></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};const details=q('details');details.ontoggle=()=>{if(!root.classList.contains('sent'))state(details.open?'editing-time':'scheduled')};q('.reschedule').onclick=()=>{const t=q('input').value;if(!t)return;q('.time').textContent='오늘 · '+t+' ⌄';details.open=false;pulse(q('.mail'),[{transform:'translateY(-6px)'},{transform:'none'}])};q('.send').onclick=()=>{details.open=false;root.classList.add('sent');q('.time').textContent='발송됨';q('.send').textContent='✓';q('.send').disabled=true;q('summary').style.pointerEvents='none';q('summary').tabIndex=-1;state('sent')};})();
</script>
