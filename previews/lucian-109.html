<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">

<title>Availability · Lucian</title>

<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "주간 가능 시간 칠하기", "category": "공간·일정·디자인 도구", "summary": "한 주의 가능 시간을 칸에 칠해 표시하는 표입니다. 칸을 누르거나 여러 칸을 끌어 한 번에 칠하고, 칠한 시간의 합계가 바로 바뀝니다.", "hint": "시간 칸을 누르거나 끌어서 칠해 보세요. Esc를 누르면 모두 지웁니다", "shape": "square", "fluid": true, "hue": "#A66A17", "hue2": "#3D8BFF", "tags": ["availability", "native", "spatial"]} -->
<!-- @demo [["wait", 500], ["drag", ".u109 .slot", 5, [0.5, 0.5], [3.6, 0.5], 900], ["wait", 700], ["drag", ".u109 .slot", 11, [0.5, 0.5], [2.6, 0.5], 700], ["wait", 1300], ["key", ".u109 .slot", 0, "Escape", 1, 1000]] -->
<!-- @en {"title": "Weekly availability painter", "summary": "A grid for painting the hours you’re free this week. Press a cell or drag across several to fill them at once, and the total updates right away.", "hint": "Press or drag across the hour cells to paint them. Esc clears them all","map":[
  ["['월','화','수','목','금']", "['Mon','Tue','Wed','Thu','Fri']"],
  ["${d}요일 ${9+r}시", "${d} ${9+r}:00"],
  ["0시간", "0h"],
  ["+'시간'", "+'h'"]
]} -->
<style>
.u109{width:100%;max-width:400px;min-width:0;font-size:13px}.u109 button{font:inherit;color:inherit;cursor:pointer}.u109 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u109 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u109{padding:12px 4px}.u109 .week{display:grid;grid-template-columns:38px repeat(5,1fr);gap:6px;touch-action:none}.u109 .week>span{font-size:12px;color:var(--ux-ink-2);text-align:center;align-self:center;min-height:28px}.u109 .slot{height:36px;padding:0;border:1px solid var(--ux-line-2);border-radius:3px;background:var(--ux-surface-2);color:var(--ux-accent-ink)}.u109 .slot[aria-pressed=true]{background:var(--ux-accent);border-color:var(--ux-accent)}.u109 .slot[aria-pressed=true]:after{content:"✓"}.u109 output{display:block;text-align:right;margin-top:15px;font-size:13px;color:var(--ux-ink-2)}
</style>
<div class="ux u109"><div class="week"></div><output aria-live="polite">0시간</output></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const days=['월','화','수','목','금'];q('.week').innerHTML='<span></span>'+days.map(d=>`<span>${d}</span>`).join('')+Array.from({length:5},(_,r)=>`<span>${9+r}:00</span>`+days.map((d,c)=>`<button class="slot" data-i="${r*5+c}" aria-label="${d}요일 ${9+r}시" aria-pressed="false"></button>`).join('')).join('');let set=new Set(),paintMode=true,drag=false;function paint(){qa('.slot').forEach(b=>b.setAttribute('aria-pressed',set.has(+b.dataset.i)));q('output').textContent=set.size+'시간'}function apply(b){if(!b)return;const i=+b.dataset.i;paintMode?set.add(i):set.delete(i);paint()}qa('.slot').forEach(b=>{b.onpointerdown=e=>{drag=true;paintMode=!set.has(+b.dataset.i);b.setPointerCapture(e.pointerId);apply(b)};b.onpointermove=e=>{if(drag&&b.hasPointerCapture(e.pointerId)){const el=document.elementFromPoint(e.clientX,e.clientY);if(el?.classList.contains('slot'))apply(el)}};b.onpointerup=()=>drag=false;b.onpointercancel=()=>drag=false;b.onclick=e=>{if(e.detail===0){paintMode=!set.has(+b.dataset.i);apply(b)}}});root.onkeydown=e=>{if(e.key==='Escape'){set.clear();drag=false;paint()}};})();
</script>

<script src="./_fit.js"></script>
</body>
</html>
