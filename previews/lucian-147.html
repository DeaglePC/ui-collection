  --ux-mint:#119C72;

}

    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);

  color-scheme:dark;
  --ux-page:#07080D;

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<body class="ux">
<!-- @meta {"title": "정규식 일치 실험", "category": "문서·데이터 편집", "summary": "정규식을 입력하면 아래 문장에서 일치하는 부분을 바로 표시하는 실험 칸입니다. 일치 개수를 세어 주고, 문법이 틀리면 오류를 알려 줍니다.", "hint": "패턴을 B34나 [a-z]+처럼 바꿔 보세요", "shape": "square", "fluid": true, "hue": "#B44E3A", "hue2": "#22C3A6", "tags": ["regex-tester", "editing", "interactive"]} -->
<!-- @demo [["wait", 600], ["set", ".u147 [data-pattern]", 0, "B34", 1500], ["set", ".u147 [data-pattern]", 0, "[A-Z", 1500], ["set", ".u147 [data-pattern]", 0, "[A-Z]\\d{2}", 1200]] -->
<!-- @en {"title": "Regex playground", "summary": "A test field that highlights what your regular expression matches in the text below as you type. It counts the matches and flags syntax errors.", "hint": "Change the pattern to something like B34 or [a-z]+","map":[

<style>
.u147{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u147 button,.u147 input,.u147 textarea,.u147 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u147 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u147 input,.u147 textarea,.u147 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u147 .quiet{color:var(--ux-ink-2)}.u147 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u147 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u147 [hidden]{display:none!important}.u147 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u147 *{animation:none!important;transition:none!important}}
.u147{background:var(--ux-surface);padding:21px 23px 23px;border-bottom:2px solid var(--ux-line-2)}.u147 .pattern{display:flex;align-items:center;gap:9px;font:16px ui-monospace,monospace;color:var(--ux-accent)}.u147 [data-pattern]{flex:1;width:100%;border:0;border-bottom:1px solid var(--ux-line-2);border-radius:0;background:transparent;padding:8px 0;font:15px ui-monospace,monospace;color:var(--ux-ink)}.u147 .pattern small{font-size:12px}.u147 .sample{position:relative;margin-top:24px;min-height:98px}.u147 textarea,.u147 .matches{width:100%;height:98px;padding:0;border:0;border-radius:0;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.9 ui-monospace,monospace;resize:none;background:transparent}.u147 .matches{position:absolute;inset:0;pointer-events:none;color:var(--ux-ink)}.u147 textarea{position:relative;color:transparent;caret-color:var(--ux-ink)}.u147 textarea::selection{background:var(--ux-accent-soft);color:transparent}.u147 mark{background:var(--ux-accent-soft);color:var(--ux-ink);border-radius:3px;outline:1px solid var(--ux-accent)}.u147 .error{font-size:12px;color:var(--ux-danger);margin:0}
</style>
<div class="ux u147"><label class="pattern"><span>/</span><input data-pattern value="[A-Z]\d{2}" maxlength="80" aria-label="정규식 패턴"><span>/</span><small>g</small></label><div class="sample"><pre class="matches" aria-hidden="true"></pre><textarea aria-label="검사할 문장" maxlength="180">ID: A12, B34, C56.</textarea></div><p class="error" data-error hidden role="status">패턴 오류 · 문법을 확인하세요</p><span class="sr" data-state aria-live="polite"></span></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};function render(){const text=$('textarea').value,pattern=$('[data-pattern]').value;try{const matches=pattern?[...text.matchAll(new RegExp(pattern,'g'))]:[],parts=[];let pos=0;for(const m of matches){parts.push(esc(text.slice(pos,m.index))+'<mark>'+esc(m[0]||'∅')+'</mark>');pos=m.index+m[0].length}parts.push(esc(text.slice(pos)));$('.matches').innerHTML=parts.join('');$('[data-error]').hidden=true;$('[data-state]').textContent=matches.length+'개 일치'}catch(e){$('.matches').textContent=text;$('[data-error]').hidden=false;$('[data-state]').textContent='패턴 오류'}}$$('input,textarea').forEach(i=>i.oninput=()=>{render();$$('.matches mark').forEach(m=>motion(m,[{opacity:.65},{opacity:1}],{duration:160}))});render();})();
</script>
