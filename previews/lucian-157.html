<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[['스토리지','128 GB·h','31%'],['API','184 GB·h','45%'],['모델','96 GB·h','24%']];function choose(k){if(k>=0){const ys=[[146,133,148,119,107,115,98],[145,146,138,121,141,111,139],[146,136,145,133,139,136,142]],xs=[0,50,100,150,200,250,320];q('.solo-area').setAttribute('d',ys[k].map((y,i)=>(i?'L':'M')+xs[i]+' '+y).join('')+'V171H0Z');q('.solo-area').setAttribute('fill',['#3D9B83','#7085BD','#C38752'][k])}q('.area').classList.toggle('isolated',k>=0);qa('.area path[data-k]').forEach(p=>p.classList.toggle('chosen',+p.dataset.k===k));qa('.controls button').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));q('.status').innerHTML=k<0?'408 GB·h / 7일':`${d[k][0]} ${d[k][1]} · <b>${d[k][2]}</b>`;root.dataset.state=String(k)}qa('.controls button').forEach((b,i)=>b.onclick=()=>choose(root.dataset.state===String(i)?-1:i));choose(-1);})();
