<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "줄을 정리하는 활자판", "category": "문서·데이터 편집", "summary": "여러 줄 목록의 공백과 중복을 걷어 내고 정렬하는 정리 도구입니다. 버튼마다 한 가지 정리를 바로 적용하고, Ctrl/⌘+Z로 되돌릴 수 있습니다.", "hint": "공백·중복·정렬 버튼을 차례로 눌러 보세요", "shape": "square", "fluid": true, "hue": "#885ACC", "hue2": "#22C3A6", "tags": ["line-cleaner", "editing", "interactive"]} -->
<!-- @demo [["wait", 600], ["tap", ".u150 [data-trim]", 0], ["wait", 900], ["tap", ".u150 [data-dedup]", 0], ["wait", 900], ["tap", ".u150 [data-sort]", 0], ["wait", 1700], ["reset"]] -->
<!-- @en {"title": "Line tidier", "summary": "A tidy-up tool that strips stray spaces and duplicates from a list and sorts it. Each button applies one cleanup instantly, and Ctrl/⌘+Z undoes it.", "hint": "Press Trim, Dedupe and Sort in turn","map":[

<style>
.u150{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u150 button,.u150 input,.u150 textarea,.u150 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u150 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u150 input,.u150 textarea,.u150 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u150 .quiet{color:var(--ux-ink-2)}.u150 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u150 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u150 [hidden]{display:none!important}.u150 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u150 *{animation:none!important;transition:none!important}}
.u150{padding:22px 24px;background:var(--ux-surface);border-left:2px solid var(--ux-accent);border-radius:3px;box-shadow:0 8px 18px var(--ux-shadow)}.u150 textarea{width:100%;height:171px;border:0;border-radius:0;padding:0;background:transparent;resize:none;font:19px/2 Georgia,'Apple SD Gothic Neo',serif}.u150 .tools{display:flex;gap:7px;border-top:1px solid var(--ux-line);padding-top:15px;margin-top:15px}.u150 .tools button{border:0;background:var(--ux-surface-2);font-size:12px;flex:1}.u150 .tools button:active{background:var(--ux-accent-soft);color:var(--ux-accent)}
</style>
<div class="ux u150"><textarea aria-label="정리할 줄"> 바질

<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const editor=$('textarea'),history=[];editor.addEventListener('input',()=>history.length=0);function clean(type){history.push(editor.value);let lines=editor.value.split('\n');if(type==='trim')lines=lines.map(x=>x.trim()).filter(Boolean);if(type==='dedup')lines=[...new Set(lines.map(x=>x.trim()).filter(Boolean))];if(type==='sort')lines.sort((a,b)=>a.trim().localeCompare(b.trim(),'ko'));editor.value=lines.join('\n');motion(editor,[{transform:'translateX(3px)'},{transform:'none'}])}$$('button').forEach(b=>b.onclick=()=>clean(b.hasAttribute('data-trim')?'trim':b.hasAttribute('data-dedup')?'dedup':'sort'));root.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&history.length){e.preventDefault();editor.value=history.pop()}});})();
</script>
