/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;

/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<style>

<div class="ux u193" data-state="initial"><div class="breath-space"><div class="bloom"></div><button class="start" aria-pressed="false"><span>호흡 시작</span><small></small></button></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let running=false,phase=0,timer,started;const names=['들이쉬기','잠시 멈추기','내쉬기'],seconds=[4,2,4];function begin(){started=performance.now();q('.start span').textContent=names[phase];q('.bloom').style.transform=phase===2?'scale(1)':'scale(1.6)';q('.bloom').style.borderRadius=phase===2?'46% 54% 55% 45% / 52% 44% 56% 48%':'50%';q('.bloom').style.transitionDuration=reduced?'0s':seconds[phase]+'s';state('breathing-'+phase)}function tick(){if(!running)return;const left=Math.max(0,seconds[phase]-(performance.now()-started)/1000);q('.start small').textContent=Math.ceil(left)+'초';if(left<=0){phase=(phase+1)%3;begin()}timer=setTimeout(tick,100)}q('.start').onclick=()=>{if(running){running=false;clearTimeout(timer);q('.bloom').style.transform='scale(1)';q('.start span').textContent='호흡 시작';q('.start small').textContent='';q('.start').setAttribute('aria-pressed','false');state('initial');return}running=true;phase=0;q('.start').setAttribute('aria-pressed','true');begin();tick()};})();
</script>
