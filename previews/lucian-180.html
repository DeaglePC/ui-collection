<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let n=1;function render(){qa('.person').forEach((p,i)=>p.classList.toggle('done',i<n));q('.approve').textContent=n===1?'검토 승인':n===2?'최종 승인':'승인 완료 · 다시';state('approved-'+n)}q('.approve').onclick=()=>{n=n===3?1:n+1;render();pulse(qa('.seal')[n-1],[{transform:'rotate(-25deg) scale(1.35)',opacity:.2},{transform:'rotate(-12deg) scale(1)',opacity:1}])};})();
