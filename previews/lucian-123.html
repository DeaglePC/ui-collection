<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "색 혼합 모드", "category": "공간·일정·디자인 도구", "summary": "두 색 원이 겹친 부분으로 혼합 모드를 비교하는 견본입니다. 버튼을 누를 때마다 곱하기·스크린·오버레이 등 여섯 가지 모드가 차례로 바뀝니다.", "hint": "아래 버튼을 여러 번 눌러 보세요. Esc로 기본 모드로 돌아갑니다", "shape": "square", "fluid": true, "hue": "#8A55C9", "hue2": "#3D8BFF", "tags": ["blend-mode", "native", "spatial"]} -->

<!-- @en {"title": "Blend modes", "summary": "A sample that compares blend modes where two colored circles overlap. Each press of the button cycles through six modes, including multiply, screen and overlay.", "hint": "Press the button below a few times. Esc returns to normal","map":[

<style>
.u123{width:100%;max-width:400px;min-width:0;font-size:13px}.u123 button{font:inherit;color:inherit;cursor:pointer}.u123 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u123 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u123 .stage{height:215px;position:relative;background:#e9e4da;isolation:isolate;border-radius:100px 5px 5px 5px;overflow:hidden}.u123 .first,.u123 .second{position:absolute;width:150px;height:150px;border-radius:50%;top:33px}.u123 .first{background:#cfa26d;left:calc(50% - 115px)}.u123 .second{background:#698fa4;left:calc(50% - 35px);mix-blend-mode:var(--blend,normal)}.u123 .mode{display:block;width:150px;min-height:44px;margin:18px auto 0;border:1px solid var(--ux-line-2);border-radius:22px;background:var(--ux-surface);font-size:13px;color:var(--ux-ink);padding:8px 13px}
</style>
<div class="ux u123"><div class="stage" aria-label="두 색상 원의 합성"><div class="first"></div><div class="second"></div></div><button class="mode" aria-label="혼합 모드 기본, 누르면 다음 모드">기본 ↻</button></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const modes=[['normal','기본'],['multiply','곱하기'],['screen','스크린'],['overlay','오버레이'],['difference','차이'],['color','색상']];let i=0;function paint(){root.style.setProperty('--blend',modes[i][0]);q('.mode').textContent=modes[i][1]+' ↻';q('.mode').setAttribute('aria-label','혼합 모드 '+modes[i][1]+', 누르면 다음 모드')}q('.mode').onclick=()=>{i=(i+1)%modes.length;paint()};q('.mode').onkeydown=e=>{if(e.key==='Escape'){i=0;paint()}};})();
</script>
