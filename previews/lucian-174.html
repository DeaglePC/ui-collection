<!-- @meta {"title": "방향별로 펼치는 분포 장미", "category": "분석·데이터", "summary": "바람이 불어온 방향별 빈도를 꽃잎처럼 펼친 바람 장미입니다. 방향을 고르면 그 방향의 관측 횟수와 비율이 표시되고, ‘강풍만’을 켜면 센 바람만 다시 그립니다.", "hint": "둘레의 방향 이름을 누르거나 ‘강풍만’을 켜 보세요", "shape": "square", "fluid": true, "hue": "#CD6E39", "hue2": "#FF6B8B", "tags": ["wind-rose", "analytics"]} -->

<style>.u174{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u174 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u174 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u174 button:active{transform:scale(.97)}.u174 small{color:var(--ux-ink-2);font-size:12px}.u174 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u174 .status b{color:var(--ux-ink)}.u174 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u174 svg{display:block;width:100%;overflow:visible}.u174 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u174 .gridline{stroke:var(--ux-line-2);fill:none}.u174 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u174 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}

<div class="ux u174"><div class="inline"><button class="speed" aria-pressed="false">강풍만</button></div><div class="rose-frame"><svg class="rose" viewBox="0 0 260 220" aria-hidden="true"><circle cx="130" cy="105" r="76" class="gridline"/><circle cx="130" cy="105" r="40" class="gridline"/><g class="wedges"></g></svg><div class="directions" role="group" aria-label="풍향 선택"></div></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const dirs=['북','북동','동','남동','남','남서','서','북서'],all=[26,18,12,8,6,10,22,34],strong=[10,7,4,2,1,3,9,18];let speed=false,k=-1;function wedge(i,r){let a=(-90+i*45-16)*Math.PI/180,b=(-90+i*45+16)*Math.PI/180;return `M130 105L${130+Math.cos(a)*r} ${105+Math.sin(a)*r}A${r} ${r} 0 0 1 ${130+Math.cos(b)*r} ${105+Math.sin(b)*r}Z`}q('.directions').innerHTML=dirs.map((d,i)=>`<button data-k="${i}" style="left:${50+Math.cos((-90+i*45)*Math.PI/180)*31.25}%;top:${115+Math.sin((-90+i*45)*Math.PI/180)*90}px">${d}</button>`).join('');function draw(){const data=speed?strong:all,total=data.reduce((a,b)=>a+b,0);q('.wedges').innerHTML=data.map((v,i)=>`<path class="wedge ${i===k?'active':''}" d="${wedge(i,v/34*76)}" fill="${speed?'#AE7142':'#4C91A0'}"/>`).join('');q('.speed').setAttribute('aria-pressed',speed);qa('[data-k]').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));q('.status').innerHTML=k<0?`${speed?'8 m/s 이상':'전체'} 관측 ${total}회`:`${dirs[k]} ${data[k]}회 · ${(data[k]/total*100).toFixed(1)}%`;root.dataset.state=speed+':'+k}q('.speed').onclick=()=>{speed=!speed;draw()};qa('[data-k]').forEach((b,i)=>b.onclick=()=>{k=k===i?-1:i;draw()});draw();})();
</script>
