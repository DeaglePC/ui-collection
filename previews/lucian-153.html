<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "유입에서 구매까지 흐르는 길", "category": "분석·데이터", "summary": "채널별 유입이 관심을 거쳐 구매로 이어지는 흐름을 띠로 그린 생키 도표입니다. 채널을 누르면 그 흐름만 진하게 남고, 같은 채널을 다시 누르면 전체로 돌아갑니다.", "hint": "아래 채널 이름을 눌러 흐름을 골라 보세요", "shape": "square", "fluid": true, "hue": "#B4598E", "hue2": "#FF6B8B", "tags": ["sankey-route", "analytics"]} -->

<style>.u153{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u153 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u153 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u153 button:active{transform:scale(.97)}.u153 small{color:var(--ux-ink-2);font-size:12px}.u153 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u153 .status b{color:var(--ux-ink)}.u153 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u153 svg{display:block;width:100%;overflow:visible}.u153 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u153 .gridline{stroke:var(--ux-line-2);fill:none}.u153 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u153 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u153{background:var(--ux-surface-2);border-radius:28px 5px 28px 5px}.u153 svg{height:180px}.u153 .flows{height:185px}.u153 .flows path{fill:none;stroke-linecap:butt;opacity:.33;transition:stroke-width .5s,opacity .5s}.u153 .flows path.active{opacity:.8;stroke-dasharray:8 2;animation:u153-flow 1.2s linear infinite}.u153 .nodes{display:flex;justify-content:space-between;gap:12px;margin-top:4px}.u153 .nodes button{flex:1;background:var(--ux-surface)}.u153 .nodes button[aria-pressed="true"]{border-width:2px}@keyframes u153-flow{to{stroke-dashoffset:-20}}.u153{min-height:0;box-shadow:none}.u153 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u153 .inline{margin-bottom:8px}.u153{background:transparent;border-radius:0}.u153 .flows path.active{stroke-dasharray:none;animation:none}.u153 .nodes{gap:8px}.u153 .nodes button{border:0;background:transparent}.u153 .nodes button[aria-pressed="true"]{background:var(--ux-surface-3);border:0}.u153 .status{text-align:center}</style>
<div class="ux u153"><svg viewBox="0 0 300 210" aria-hidden="true"><text x="3" y="15">유입</text><text x="123" y="15">관심</text><text x="265" y="15">구매</text><g class="flows"><path data-k="0" d="M20 53 C85 53 70 70 143 70 S225 94 280 94" stroke="#3B9A80" stroke-width="35"/><path data-k="1" d="M20 115 C80 115 95 94 143 94 S235 125 280 125" stroke="#687BC3" stroke-width="24"/><path data-k="2" d="M20 165 C90 165 95 139 143 139 S233 149 280 149" stroke="#BC7B49" stroke-width="15"/></g><g fill="var(--ux-ink)"><rect x="12" y="34" width="9" height="146" rx="3"/><rect x="141" y="48" width="9" height="112" rx="3"/><rect x="279" y="74" width="9" height="84" rx="3"/></g></svg><div class="nodes"><button data-k="0">검색</button><button data-k="1">직접</button><button data-k="2">소셜</button></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[['검색',1320,260],['직접',760,128],['소셜',400,40]];function choose(k){qa('.nodes button').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));qa('.flows path').forEach((p,i)=>{p.classList.toggle('active',i===k);p.style.opacity=k<0?'.5':i===k?'.9':'.12'});q('.status').innerHTML=k<0?'2,480 유입 → 428 구매':`${d[k][0]} ${d[k][1]} → ${d[k][2]} · <b>${(d[k][2]/d[k][1]*100).toFixed(1)}%</b>`;root.dataset.state=String(k)}qa('.nodes button').forEach((b,i)=>b.onclick=()=>choose(root.dataset.state===String(i)?-1:i));choose(-1);})();
</script>
