<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var pk = root.querySelector('.u232-pk'), sh = root.querySelector('.u232-sh'), cx = root.querySelector('.u232-cx'), ms = root.querySelector('.u232-ms'), dim = root.querySelector('.u232-dim');
  var P = Array.prototype.slice.call(root.querySelectorAll('.u232-fp path'));
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var gen = 0;
  function later(g, ms2, fn) { setTimeout(function () { if (g === gen && root.isConnected) fn(); }, rm ? Math.min(ms2, 80) : ms2); }
  function close() { gen++; root.classList.remove('is-sheet', 'is-ok'); sh.setAttribute('aria-hidden', 'true'); P.forEach(function (p) { p.classList.remove('is-on'); }); pk.focus({ preventScroll: true }); }

  pk.addEventListener('click', function () {
    var g = ++gen;
    root.classList.add('is-sheet'); sh.setAttribute('aria-hidden', 'false'); ms.textContent = '지문 센서에 손가락을 대 주세요';
    P.forEach(function (p, i) { later(g, 700 + i * 220, function () { p.classList.add('is-on'); }); });
