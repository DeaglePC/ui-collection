<style>
.u104{width:100%;max-width:400px;min-width:0;font-size:13px}.u104 button{font:inherit;color:inherit;cursor:pointer}.u104 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u104 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u104{position:relative}.u104 .canvas{height:245px;overflow:hidden;position:relative;border:1px solid var(--ux-line-2);border-radius:7px;background:var(--ux-surface-2)}.u104 .artboard{position:absolute;width:600px;height:400px;transform:translate(var(--x,-100px),var(--y,-70px));transition:transform .3s;display:grid;grid-template-columns:repeat(3,150px);gap:35px;padding:30px}.u104 .art{height:150px;border:12px solid var(--ux-surface);background:linear-gradient(155deg,#dca778,#a26068);box-shadow:0 3px 12px var(--ux-shadow)}.u104 .art:nth-child(2n){background:linear-gradient(135deg,#7390be,#3f4b69)}.u104 .mini{width:136px;height:94px;position:absolute;bottom:11px;right:11px;border:3px solid var(--ux-surface);padding:0;border-radius:4px;box-shadow:0 3px 14px var(--ux-shadow-strong);touch-action:none;cursor:crosshair}.u104 .mini svg{width:100%;height:100%;display:block;pointer-events:none}.u104 .viewport{position:absolute;left:25px;top:18px;border:2px solid var(--ux-accent);background:#fff3;pointer-events:none}

<div class="ux u104"><div class="canvas" aria-label="큰 아트보드"><div class="artboard"><div class="art"></div><div class="art"></div><div class="art"></div><div class="art"></div><div class="art"></div><div class="art"></div></div></div><button class="mini" aria-label="미니맵 위치, 방향키로 이동"><svg viewBox="0 0 600 400" aria-hidden="true"><rect width="600" height="400" fill="#c9cfda"/><g fill="#bf765f"><rect x="30" y="30" width="150" height="150"/><rect x="400" y="30" width="150" height="150"/><rect x="215" y="215" width="150" height="150"/></g><g fill="#5879ad"><rect x="215" y="30" width="150" height="150"/><rect x="30" y="215" width="150" height="150"/><rect x="400" y="215" width="150" height="150"/></g></svg><span class="viewport"></span></button><output class="sr" aria-live="polite"></output></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let x=100,y=70;function paint(){x=Math.max(0,Math.min(600-q(".canvas").clientWidth,x));y=Math.max(0,Math.min(400-q(".canvas").clientHeight,y));root.style.setProperty("--x",-x+"px");root.style.setProperty("--y",-y+"px");const m=q(".mini"),v=q(".viewport");v.style.left=x/600*m.clientWidth+"px";v.style.top=y/400*m.clientHeight+"px";v.style.width=q(".canvas").clientWidth/600*m.clientWidth+"px";v.style.height=q(".canvas").clientHeight/400*m.clientHeight+"px";q("output").textContent="위치 "+x+", "+y}function point(e){const r=q(".mini").getBoundingClientRect();x=Math.round((e.clientX-r.left)/r.width*600-q(".canvas").clientWidth/2);y=Math.round((e.clientY-r.top)/r.height*400-q(".canvas").clientHeight/2);paint()}q(".mini").onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);point(e)};q(".mini").onpointermove=e=>{if(e.currentTarget.hasPointerCapture(e.pointerId))point(e)};q(".mini").onkeydown=e=>{const d={ArrowLeft:[-40,0],ArrowRight:[40,0],ArrowUp:[0,-40],ArrowDown:[0,40]}[e.key];if(d){e.preventDefault();x+=d[0];y+=d[1];paint()}if(e.key==="Escape"||e.key==="Home"){e.preventDefault();x=100;y=70;paint()}};new ResizeObserver(paint).observe(q(".canvas"));paint();})();
</script>
