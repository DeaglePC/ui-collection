<body class="ux">
<!-- @meta {"title": "3채널 오디오 믹서", "category": "작업·시스템", "summary": "목소리·음악·공간음 세 채널의 소리 크기를 맞추는 믹서입니다. 페이더로 레벨을 바꾸고 채널 이름을 눌러 음소거하며, 실제 소리는 나지 않습니다.", "hint": "채널 이름을 눌러 음소거하거나 페이더를 움직여 보세요", "shape": "square", "fluid": true, "hue": "#53877a", "hue2": "#7B61FF", "tags": ["channel-mixer", "new-century"]} -->

<!-- @en {"title": "Three-channel mixer", "summary": "A mixer for balancing voice, music and ambience. Move a fader to set its level or press a channel name to mute it; no actual sound plays.", "hint": "Press a channel name to mute it, or move a fader","map":[

<style>
.u192 {width:100%;max-width:370px;font-size:14px;line-height:1.45;position:relative;--a:#cd5339;--soft:color-mix(in srgb,var(--a) 12%,var(--ux-surface));font-variant-numeric:tabular-nums}
.u192 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);border-radius:9px;padding:9px 12px;min-height:38px;transition:background .2s,transform .3s,color .2s;color:var(--ux-ink)}
.u192 button:active{transform:translateY(1px)}.u192 button:disabled{opacity:.4;cursor:default}.u192 button.primary{background:var(--ux-ink);color:var(--ux-page);border-color:transparent}
.u192 .muted{color:var(--ux-ink-2);font-size:12px}.u192 .eyebrow{font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ux-ink-2)}
.u192 .row{display:flex;align-items:center;justify-content:space-between;gap:8px}.u192 .actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.u192 input,.u192 select{max-width:100%;min-width:0;background:var(--ux-surface);color:var(--ux-ink);border:1px solid var(--ux-line-2);border-radius:7px;padding:8px;font:inherit}
.u192 output{font-variant-numeric:tabular-nums}.u192 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.u192 *,.u192 *::before,.u192 *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.u192 .console{background:var(--ux-surface);border:1px solid var(--ux-line-2);border-radius:18px;padding:21px;box-shadow:0 8px 0 var(--ux-surface-3)}.u192 .channels{display:flex;gap:13px;justify-content:space-between;margin-top:20px}.u192 .channel{flex:1;min-width:0;text-align:center;border-right:1px solid var(--ux-line);padding-right:9px}.u192 .channel:last-child{border:0;padding:0}.u192 .channel b{font:11px ui-monospace;color:var(--ux-ink-2)}.u192 .fader{height:145px;display:flex;justify-content:center;gap:13px;margin:12px 0}.u192 input[type=range]{writing-mode:vertical-lr;direction:rtl;width:23px;height:145px;padding:0;border:0;accent-color:#53877a;cursor:ns-resize;background:none}.u192 .level{height:145px;width:8px;position:relative;background:var(--ux-surface-3);border-radius:2px;overflow:hidden}.u192 .level i{position:absolute;left:0;right:0;bottom:0;height:var(--level);background:repeating-linear-gradient(0deg,#79a183 0 5px,var(--ux-surface) 5px 7px);transition:height .35s}.u192 .channel output{display:block;font:17px ui-monospace;margin:5px 0}.u192 .mute{font-size:10px;width:100%;padding:5px;min-height:30px}.u192 .mute[aria-pressed=true]{background:#b66448;color:white;border-color:transparent}.u192 .reset{font-size:10px;padding:2px 7px;min-height:25px;border:0;background:none}

/* Focused composition */
.u192{max-width:320px}.u192 {max-width:280px}.u192 .console{padding:22px 20px 18px;border-radius:15px}.u192 .channels{margin:0;gap:15px}.u192 .channel .mute{background:none;border:0;padding:0 2px;font:10px ui-monospace;min-height:25px;margin:0 0 14px;letter-spacing:1px}.u192 .channel .mute[aria-pressed=true]{color:light-dark(#a64732,#ef967b);text-decoration:line-through;background:none}.u192 .fader{height:139px}.u192 .channel output{font-size:11px;margin-top:12px}</style>
<div class="ux u192" data-state="initial"><div class="console"><div class="channels"><div class="channel"><button class="mute" data-i="0" aria-pressed="false" aria-label="VOICE 음소거">VOICE</button><div class="fader"><div class="level"><i></i></div><input type="range" min="0" max="100" value="72" data-i="0" aria-label="VOICE 볼륨"></div><output>72%</output></div><div class="channel"><button class="mute" data-i="1" aria-pressed="false" aria-label="MUSIC 음소거">MUSIC</button><div class="fader"><div class="level"><i></i></div><input type="range" min="0" max="100" value="45" data-i="1" aria-label="MUSIC 볼륨"></div><output>45%</output></div><div class="channel"><button class="mute" data-i="2" aria-pressed="false" aria-label="AIR 음소거">AIR</button><div class="fader"><div class="level"><i></i></div><input type="range" min="0" max="100" value="28" data-i="2" aria-label="AIR 볼륨"></div><output>28%</output></div></div></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let muted=[false,false,false];function render(){qa('.channel').forEach((c,i)=>{const val=+c.querySelector('input').value;c.querySelector('i').style.setProperty('--level',(muted[i]?0:val)+'%');c.querySelector('output').textContent=muted[i]?'—':val+'%';c.querySelector('button').setAttribute('aria-pressed',muted[i])});state('mix-'+qa('input').map(i=>i.value).join('-')+'-'+muted.join('-'))}qa('input').forEach(i=>i.oninput=render);qa('.mute').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;muted[i]=!muted[i];render()});render();})();
</script>
