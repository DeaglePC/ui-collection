<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="源集：把许可明确的开源 UI 收在一起，分好类，能搜索，并注明来源。" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>源集 · 开源 UI 集合</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    
    <link rel="stylesheet" href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>
  <script>
(function () {
  var file = location.protocol === "file:";
  if (file) {
    var links = document.querySelectorAll('link[rel="stylesheet"]');
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute("href") || "";
      if (href.indexOf("./assets/") === 0 && href.slice(-4) === ".css") {
        links[i].setAttribute("href", "./assets/style.file.css");
      }
    }
  }
  var s = document.createElement("script");
  if (file) {
    s.defer = true;
    s.src = "./assets/app.file.js";
  } else {
    s.type = "module";
    s.src = "./assets/app.js";
  }
  document.head.appendChild(s);
})();
</script>
  </body>
</html>
