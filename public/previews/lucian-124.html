<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "색 대비 검사", "category": "공간·일정·디자인 도구", "summary": "글자색과 배경색의 대비를 바로 계산하는 검사기입니다. 색 값을 바꾸면 미리보기와 대비 비율이 바뀌고, 일반 글자 기준 AA 통과 여부가 표시됩니다.", "hint": "글자 색 값을 다른 HEX로 바꿔 보세요", "shape": "square", "fluid": true, "hue": "#A66A17", "hue2": "#3D8BFF", "tags": ["contrast", "native", "spatial"]} -->
<!-- @demo [["wait", 500], ["set", ".fg", 0, "#94a3b8", 650], ["wait", 900], ["set", ".fg", 0, "#334155", 650], ["wait", 500]] -->
<!-- @en {"title": "Contrast checker", "summary": "A checker that calculates text and background contrast as you type. Change a color and the preview and ratio update, along with whether normal text passes AA.", "hint": "Change the text color to another HEX value","map":[

<style>
.u124{width:100%;max-width:400px;min-width:0;font-size:13px}.u124 button{font:inherit;color:inherit;cursor:pointer}.u124 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u124 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u124{max-width:350px}.u124 .sample{height:190px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;color:#334155;background:#f8fafc;border:1px solid var(--ux-line-2);border-radius:9px}.u124 .sample b{font-size:58px;font-family:Georgia,serif;font-weight:500}.u124 .sample span{font-size:14px}.u124 .colors{display:flex;gap:18px;margin-top:18px}.u124 .colors label{display:flex;flex:1;gap:7px;align-items:center;font-size:12px;color:var(--ux-ink-2)}.u124 .colors input{min-width:0;width:90px;flex:1;min-height:40px;padding:7px 6px;border:0;border-bottom:1px solid var(--ux-line-2);background:transparent;font:12px ui-monospace,monospace;color:var(--ux-ink)}.u124 input[aria-invalid=true]{border-color:var(--ux-danger)}.u124 .ratio{display:flex;justify-content:space-between;align-items:center;margin-top:17px;font-size:13px}.u124 .number{font-size:24px;font-variant-numeric:tabular-nums}.u124 .grade{color:var(--ux-ink-2)}
</style>
<div class="ux u124"><div class="sample"><b>Aa</b><span>읽기 좋은 화면</span></div><div class="colors"><label>글자<input class="fg" type="text" value="#334155" aria-label="글자 색 6자리 HEX" pattern="#[0-9a-fA-F]{6}" maxlength="7" spellcheck="false"></label><label>배경<input class="bg" type="text" value="#f8fafc" aria-label="배경 색 6자리 HEX" pattern="#[0-9a-fA-F]{6}" maxlength="7" spellcheck="false"></label></div><div class="ratio" aria-live="polite"><output class="number"></output><span class="grade"></span></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];function lum(hex){const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(c=>c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4));return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722}function paint(){let valid=true;qa('input').forEach(el=>{let ok=/^#[a-f0-9]{6}$/i.test(el.value);el.setAttribute('aria-invalid',!ok);valid=valid&&ok});if(!valid)return;const f=q('.fg').value,b=q('.bg').value,l1=lum(f),l2=lum(b),ratio=(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);q('.sample').style.color=f;q('.sample').style.background=b;q('.number').textContent=ratio.toFixed(2)+' : 1';q('.grade').textContent=ratio>=4.5?'✓ 일반 AA':'× 일반 AA 미달'}qa('input').forEach(x=>x.oninput=paint);paint();})();
</script>
