<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;

  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);

}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>

<body class="ux">
<!-- @meta {"title": "하루 거래를 펼치는 봉", "category": "분석·데이터", "summary": "닷새 동안의 거래를 시가·고가·저가·종가 봉으로 그린 캔들 차트입니다. 봉을 고르면 그날의 네 가격과 등락률이 아래에 표시됩니다.", "hint": "캔들을 하나씩 눌러 보세요", "shape": "square", "fluid": true, "hue": "#CD6E39", "hue2": "#FF6B8B", "tags": ["candlestick-detail", "analytics"]} -->

<style>.u159{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u159 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u159 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u159 button:active{transform:scale(.97)}.u159 small{color:var(--ux-ink-2);font-size:12px}.u159 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u159 .status b{color:var(--ux-ink)}.u159 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u159 svg{display:block;width:100%;overflow:visible}.u159 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u159 .gridline{stroke:var(--ux-line-2);fill:none}.u159 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u159 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u159{border-radius:22px;background:var(--ux-surface-2)}.u159 .candles{height:158px;display:flex;gap:16px;padding:20px 13px 0;border-bottom:1px solid var(--ux-line-2);background:linear-gradient(var(--ux-line) 1px,transparent 1px);background-size:100% 33%}.u159 .candle{position:relative;flex:1;min-height:0;height:135px;padding:0;background:transparent;border:0;border-radius:0}.u159 .candle::before{content:"";position:absolute;width:2px;left:50%;top:calc(var(--hi)*1px);height:calc((var(--lo) - var(--hi))*1px);background:var(--col)}.u159 .candle i{position:absolute;left:18%;width:68%;top:calc(var(--top)*1px);height:calc(var(--body)*1px);background:var(--col);border-radius:2px;transition:transform .4s}.u159 .candle[aria-pressed="true"]{background:var(--ux-accent-soft);outline:1px dashed var(--ux-accent);outline-offset:5px}.u159 .candle[aria-pressed="true"] i{transform:scaleX(1.18)}.u159 .ohlc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.u159 .ohlc small,.u159 .ohlc b{display:block}.u159 .ohlc b{font-variant-numeric:tabular-nums;margin-top:4px}.u159 .status{margin-top:8px}.u159{min-height:0;box-shadow:none}.u159 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u159 .inline{margin-bottom:8px}.u159{background:transparent;border-radius:0}.u159 .candles{padding-top:12px;gap:20px;background:none;height:150px}.u159 .candle[aria-pressed="true"]{outline:none;border-bottom:3px solid var(--ux-accent);background:var(--ux-accent-soft);border-radius:3px}.u159 .ohlc{margin-top:12px}.u159 .status{text-align:center}.u159 .candle:focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}</style>
<div class="ux u159"><div class="candles" role="group" aria-label="거래일 캔들"></div><div class="ohlc"><span><small>시가</small><b class="open"></b></span><span><small>고가</small><b class="high"></b></span><span><small>저가</small><b class="low"></b></span><span><small>종가</small><b class="close"></b></span></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[[124,139,117,134],[134,145,130,140],[140,143,119,124],[124,139,121,136],[136,151,131,147]],y=n=>(155-n)*3;let k=4;q('.candles').innerHTML=d.map((v,i)=>`<button class="candle" data-k="${i}" aria-label="10월 ${6+i}일 거래 상세" style="--hi:${y(v[1])};--lo:${y(v[2])};--top:${y(Math.max(v[0],v[3]))};--body:${Math.abs(v[0]-v[3])*3};--col:${v[3]>=v[0]?'var(--ux-mint)':'var(--ux-danger)'}"><i></i></button>`).join('');function draw(){qa('.candle').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));['open','high','low','close'].forEach((n,i)=>q('.'+n).textContent=d[k][i].toFixed(2));q('.status').innerHTML=`10월 ${6+k}일 · ${d[k][3]>=d[k][0]?'상승':'하락'} <b>${((d[k][3]/d[k][0]-1)*100).toFixed(2)}%</b>`;root.dataset.state=String(k)}qa('.candle').forEach((b,i)=>b.onclick=()=>{k=i;draw()});draw();})();
</script>
