<script>

    ['도쿄', '나리타 국제공항', 'NRT', '2시간 25분', 'linear-gradient(140deg,#FF7A93,#F0264D)'],
    ['도쿄', '하네다 공항', 'HND', '2시간 20분', 'linear-gradient(140deg,#FF8A65,#E5484D)'],
    ['도하', '하마드 국제공항', 'DOH', '10시간 40분', 'linear-gradient(140deg,#B07CFF,#7B61FF)'],
    ['오사카', '간사이 국제공항', 'KIX', '1시간 50분', 'linear-gradient(140deg,#FFB547,#FF7A45)'],

    ['방콕', '수완나품 공항', 'BKK', '5시간 50분', 'linear-gradient(140deg,#5B8CFF,#22C3A6)'],
    ['다낭', '다낭 국제공항', 'DAD', '4시간 30분', 'linear-gradient(140deg,#3D8BFF,#8B6CFF)']

    var q = input.value.trim();

    act = 0;
    Array.prototype.slice.call(list.querySelectorAll('.u034-o,.u034-none')).forEach(function (n) { n.remove(); });

    if (!shown.length) { list.insertAdjacentHTML('beforeend', '<li class="u034-none">‘' + esc(q) + '’ 공항을 찾지 못했어요</li>'); }

  // 입력한 글자 뒤로, 첫 번째 후보의 남은 글자를 흐리게 겹쳐 보여 줍니다
  function mark() {
    hl.style.setProperty('--i', act);
    Array.prototype.forEach.call(list.querySelectorAll('.u034-o'), function (li, i) { li.setAttribute('aria-selected', String(i === act)); });

    input.value = d[0] + ' · ' + d[1];
