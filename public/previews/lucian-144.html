.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}

:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}

.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */

  }
}

<div class="ux u144"><table aria-label="열 편집 결과"></table><div class="restores"></div><div class="menu" hidden><button data-move>앞으로 이동</button><button data-hide>열 숨기기</button></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const titles={name:'이름',role:'역할',city:'지역'},rows=[{name:'서윤',role:'디자인',city:'서울'},{name:'지호',role:'개발',city:'부산'},{name:'민서',role:'기획',city:'제주'}];let order=['name','role','city'],visible=new Set(order),active=null;function close(){$('.menu').hidden=true;active=null}function render(){const cols=order.filter(k=>visible.has(k));$('table').innerHTML='<thead><tr>'+cols.map(k=>'<th><button data-header="'+k+'" aria-expanded="false">'+titles[k]+'</button></th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(k=>'<td>'+r[k]+'</td>').join('')+'</tr>').join('')+'</tbody>';$('.restores').innerHTML=order.filter(k=>!visible.has(k)).map(k=>'<button data-restore="'+k+'">＋ '+titles[k]+'</button>').join('');$$('[data-header]').forEach(b=>b.onclick=()=>{const same=active===b.dataset.header;close();if(same)return;active=b.dataset.header;b.setAttribute('aria-expanded','true');$('.menu').hidden=false;$('.menu').style.left=Math.max(0,Math.min(root.clientWidth-145,b.getBoundingClientRect().left-root.getBoundingClientRect().left))+'px';$('[data-hide]').disabled=visible.size===1;$('[data-move]').disabled=cols.indexOf(active)===0});$$('[data-restore]').forEach(b=>b.onclick=()=>{visible.add(b.dataset.restore);render()});root.dataset.order=JSON.stringify(cols)}$('[data-hide]').onclick=()=>{if(visible.size>1)visible.delete(active);close();render();motion($('table'),[{transform:'scaleX(.98)'},{transform:'scaleX(1)'}])};$('[data-move]').onclick=()=>{const ix=order.indexOf(active);if(ix>0)[order[ix],order[ix-1]]=[order[ix-1],order[ix]];close();render();motion($('table'),[{transform:'translateX(4px)'},{transform:'none'}])};root.addEventListener('keydown',e=>{if(e.key==='Escape'){const b=$('[data-header="'+active+'"]');close();$$('[data-header]').forEach(x=>x.setAttribute('aria-expanded','false'));b?.focus()}});render();})();
</script>
