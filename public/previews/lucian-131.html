<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repeat Form · Lucian</title>
<!-- Lucian UX/UI Prompt · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/ -->
<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "동행자 입력 묶음", "category": "문서·데이터 편집", "summary": "동행자마다 같은 입력 칸을 반복해 받는 입력 묶음입니다. 추가를 누르면 번호가 붙은 새 줄이 생기고, 줄마다 따로 지울 수 있습니다.", "hint": "‘＋ 동행자’를 눌러 줄을 늘리고 ×로 지워 보세요", "shape": "square", "fluid": true, "hue": "#0C8377", "hue2": "#22C3A6", "tags": ["repeat-form", "editing", "interactive"]} -->
<!-- @demo [["wait", 500], ["tap", ".u131 [data-add]", 0], ["wait", 500], ["type", ".u131 [data-person=\"1\"]", 0, {"ko": "지호", "en": "Jiho"}, 120], ["wait", 700], ["tap", ".u131 [data-add]", 0], ["wait", 1300], ["reset"]] -->
<!-- @en {"title": "Companion entries", "summary": "A repeating group that takes the same details for each person in your party. Add creates a new numbered row, and each row can be removed on its own.", "hint": "Press “＋ Companion” to add rows and × to remove them","map":[
  ["＋ 동행자", "＋ Companion"],
  ["동행자 '+(i+1)+' 이름", "Companion '+(i+1)+' name"],

]} -->
<style>
.u131{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u131 button,.u131 input,.u131 textarea,.u131 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u131 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u131 input,.u131 textarea,.u131 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u131 .quiet{color:var(--ux-ink-2)}.u131 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u131 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u131 [hidden]{display:none!important}.u131 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u131 *{animation:none!important;transition:none!important}}
.u131{border-left:3px solid var(--ux-accent);padding-left:19px}.u131 .person{display:flex;align-items:center;gap:12px;padding:8px 0}.u131 .person b{font:16px ui-monospace,monospace;color:var(--ux-accent);font-weight:600}.u131 input{flex:1;width:100%;background:transparent;border-width:0 0 1px;border-radius:0;padding-left:0}.u131 .remove{width:44px;border:0;background:transparent;color:var(--ux-ink-2);font-size:20px}.u131 [data-add]{margin-top:13px;background:transparent;border-style:dashed;color:var(--ux-accent)}
</style>
<div class="ux u131"><div class="people"></div><button data-add>＋ 동행자</button></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};let people=['서윤'];function render(focus=false){$('.people').innerHTML=people.map((name,i)=>'<div class="person"><b>'+String(i+1).padStart(2,'0')+'</b><input aria-label="동행자 '+(i+1)+' 이름" value="'+esc(name)+'" data-person="'+i+'"><button class="remove" data-remove="'+i+'" aria-label="동행자 '+(i+1)+' 삭제">×</button></div>').join('');$$('[data-person]').forEach(i=>i.oninput=()=>people[+i.dataset.person]=i.value);$$('[data-remove]').forEach(b=>b.onclick=()=>{people.splice(+b.dataset.remove,1);render();$('[data-add]').focus()});$('[data-add]').disabled=people.length>=4;root.dataset.count=people.length;if(focus)$$('input').at(-1)?.focus()}$('[data-add]').onclick=()=>{people.push('');render(true);motion($('.person:last-child'),[{transform:'translateY(-7px)',opacity:0},{transform:'none',opacity:1}])};render();})();
</script>

</body>
</html>
