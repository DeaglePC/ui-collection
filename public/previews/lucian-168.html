<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Waterfall · Lucian</title>
<!-- Lucian UX/UI Prompt · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/ -->
<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "응답 시간을 조각내는 요청 목록", "category": "분석·데이터", "summary": "페이지를 이루는 요청마다 대기·TLS·전송 시간을 색으로 나눈 워터폴입니다. 요청을 누르면 전송 시간이 강조되고, 다시 누르면 전체 로드 시간으로 돌아갑니다.", "hint": "요청 이름을 하나 눌러 보세요", "shape": "square", "fluid": true, "hue": "#B4598E", "hue2": "#FF6B8B", "tags": ["request-waterfall", "analytics"]} -->
<!-- @demo [["wait", 600], ["tap", ".u168 .req:nth-child(4)", 0], ["wait", 1600], ["tap", ".u168 .req", 1], ["wait", 1600], ["tap", ".u168 .req", 1], ["wait", 1000]] -->
<!-- @en {"title": "Request timing waterfall", "summary": "A waterfall that splits each request on a page into waiting, TLS and transfer time. Press a request to highlight its transfer time, and press again to see the full load time.", "hint": "Press one of the request names","map":[
  ["대기", "Wait"],
  ["전송", "Transfer"],
  ["${x[0]} 요청 상세", "${x[0]} request details"],
  ["페이지 로드 · 400 ms", "Page load · 400 ms"],
  ["${d[k][0]} · 전송 <b>", "${d[k][0]} · transfer <b>"]
]} -->
<style>.u168{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u168 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u168 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u168 button:active{transform:scale(.97)}.u168 small{color:var(--ux-ink-2);font-size:12px}.u168 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u168 .status b{color:var(--ux-ink)}.u168 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u168 svg{display:block;width:100%;overflow:visible}.u168 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u168 .gridline{stroke:var(--ux-line-2);fill:none}.u168 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u168 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u168{border-radius:16px;border:1px solid var(--ux-line-2);padding:15px}.u168 .requests{display:flex;flex-direction:column;gap:9px;margin-top:18px}.u168 .req{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:4px;background:transparent;border:0;text-align:left;min-height:31px}.u168 .req>span:first-child{font-size:10px;white-space:nowrap}.u168 .lane{display:flex;position:relative;height:16px;margin-left:var(--offset);border-radius:3px;overflow:hidden;transition:transform .4s,box-shadow .3s}.u168 .lane i{width:var(--w);background:var(--col);flex:none}.u168 .req[aria-pressed="true"]{background:var(--ux-accent-soft)}.u168 .req[aria-pressed="true"] .lane{transform:scaleY(1.25);box-shadow:0 0 0 2px var(--ux-accent-soft)}.u168 .legend{display:flex;gap:10px;margin-top:16px;font-size:10px;color:var(--ux-ink-2)}.u168 .legend i{width:7px;height:7px;display:inline-block;margin-right:4px;background:var(--c)}.u168{min-height:0;box-shadow:none}.u168 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u168 .inline{margin-bottom:8px}.u168{border:0;background:transparent;border-radius:0}.u168 .requests{margin-top:0;gap:3px}.u168 .req{min-height:42px;grid-template-columns:83px 1fr;gap:8px;padding:0}.u168 .req>span:first-child{font-size:12px}.u168 .legend{font-size:12px;margin-top:10px}.u168 .status{margin-top:8px}</style>
<div class="ux u168"><div class="requests"></div><div class="legend"><span><i style="--c:#9B85BD"></i>대기</span><span><i style="--c:#668EBC"></i>TLS</span><span><i style="--c:#449D81"></i>전송</span></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[['document',0,40,30,90],['app.js',40,60,20,75],['theme.css',55,35,20,30],['cover.webp',95,80,25,125],['fonts.woff2',100,40,20,80]];q('.requests').innerHTML=d.map((x,i)=>`<button class="req" data-k="${i}" aria-label="${x[0]} 요청 상세"><span>${x[0]}</span><span class="lane" style="--offset:${x[1]/400*100}%;width:${(x[2]+x[3]+x[4])/400*100}%">${x.slice(2).map((v,j)=>`<i style="--w:${v/(x[2]+x[3]+x[4])*100}%;--col:${['#9B85BD','#668EBC','#449D81'][j]}"></i>`).join('')}</span></button>`).join('');function choose(k){qa('.req').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));q('.status').innerHTML=k<0?'페이지 로드 · 400 ms':`${d[k][0]} · 전송 <b>${d[k][4]} ms</b>`;root.dataset.state=String(k)}qa('.req').forEach((b,i)=>b.onclick=()=>choose(root.dataset.state===String(i)?-1:i));choose(-1);})();
</script>

<script src="./_fit.js"></script>
</body>
</html>
