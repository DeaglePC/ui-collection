<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortcut Recorder · Lucian</title>
<!-- Lucian UX/UI Prompt · MIT License (c) 2026 Seokwoooo · https://lucianlabs.dev/uxui-prompt/ -->
<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "단축키 조합 기록", "category": "문서·데이터 편집", "summary": "키 조합을 직접 눌러 단축키를 정하는 기록 칸입니다. 키캡을 누르면 기록이 시작되고, 수식 키와 함께 누른 조합이 그대로 새 단축키가 됩니다.", "hint": "키캡을 누른 뒤 ⌘나 Ctrl과 함께 다른 키를 눌러 보세요. Esc로 취소합니다", "shape": "square", "fluid": true, "hue": "#0C8377", "hue2": "#22C3A6", "tags": ["shortcut-recorder", "editing", "interactive"]} -->
<!-- @demo [["wait", 600], ["tap", ".u141 [data-record]", 0], ["wait", 900], ["key", ".u141 [data-record]", 0, "K", 1, 1800, {"ctrl": true}], ["reset"]] -->
<!-- @en {"title": "Shortcut recorder", "summary": "A field for setting a shortcut by pressing it. Press the keycaps to start recording, and the combination you press with a modifier becomes the new shortcut.", "hint": "Press the keycaps, then press another key with ⌘ or Ctrl. Esc cancels","map":[
  ["단축키 기록", "Record shortcut"],
  ["빠른 메모 열기", "Open quick note"],
  ["키 조합을 눌러 주세요", "Press a key combination"],
  ["수식 키와 함께 눌러 주세요", "Include a modifier key"]
]} -->
<style>
.u141{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u141 button,.u141 input,.u141 textarea,.u141 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u141 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u141 input,.u141 textarea,.u141 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u141 .quiet{color:var(--ux-ink-2)}.u141 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u141 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u141 [hidden]{display:none!important}.u141 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u141 *{animation:none!important;transition:none!important}}
.u141{text-align:center;width:min(100%,340px)}.u141 .label{margin:0 0 24px;color:var(--ux-ink-2);font-size:14px}.u141 [data-record]{width:100%;padding:22px;border:0;background:transparent;min-height:118px}.u141 .keys{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.u141 kbd{min-width:65px;height:66px;display:grid;place-items:center;background:var(--ux-surface);border:1px solid var(--ux-line-2);border-bottom:5px solid var(--ux-line-2);border-radius:10px;box-shadow:0 6px 12px var(--ux-shadow);font:600 24px ui-monospace,monospace;transition:transform .15s}.u141 [data-record]:hover kbd{transform:translateY(-2px)}.u141[data-recording="true"] kbd{color:var(--ux-accent);border-color:var(--ux-accent)}.u141 [data-state]{height:24px;margin-top:14px;font-size:12px;color:var(--ux-ink-2)}
</style>
<div class="ux u141"><p class="label">빠른 메모 열기</p><button data-record aria-label="단축키 기록" aria-pressed="false"><span class="keys"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>K</kbd></span></button><div data-state aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};let recording=false,chord=['⌘','⇧','K'];function render(){$('.keys').innerHTML=chord.map(k=>'<kbd>'+esc(k)+'</kbd>').join('');root.dataset.recording=String(recording);$('[data-record]').setAttribute('aria-pressed',String(recording));$('[data-state]').textContent=recording?'키 조합을 눌러 주세요':''}$('[data-record]').onclick=()=>{recording=!recording;render()};root.addEventListener('keydown',e=>{if(!recording)return;if(e.key==='Escape'||e.key==='Tab'){recording=false;render();if(e.key==='Escape')e.preventDefault();return}if(['Control','Shift','Alt','Meta'].includes(e.key))return;e.preventDefault();if(!(e.ctrlKey||e.altKey||e.metaKey)){$('[data-state]').textContent='수식 키와 함께 눌러 주세요';return}chord=[e.ctrlKey?'Ctrl':null,e.metaKey?'⌘':null,e.altKey?'Alt':null,e.shiftKey?'⇧':null,e.key.toUpperCase()].filter(Boolean);recording=false;render();motion($('.keys'),[{transform:'translateY(4px)'},{transform:'none'}])});render();})();
</script>
