    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<div class="ux u142"><div class="pairs"><button class="phrase" data-source="0" aria-pressed="true"><i>1</i>Morning light</button><button class="phrase" data-target="0" aria-label="풀잎 위에서 연결"><i>·</i>풀잎 위에서</button><button class="phrase" data-source="1" aria-pressed="false"><i>2</i>on the grass</button><button class="phrase" data-target="1" aria-label="아침 햇살 연결"><i>·</i>아침 햇살</button><button class="phrase" data-source="2" aria-pressed="false"><i>3</i>gently shines</button><button class="phrase" data-target="2" aria-label="잔잔히 빛난다 연결"><i>·</i>잔잔히 빛난다</button></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};let active=0,links={};function render(){$$('[data-source]').forEach(b=>{b.classList.toggle('selected',+b.dataset.source===active);b.classList.toggle('linked',links[b.dataset.source]!==undefined);b.setAttribute('aria-pressed',String(+b.dataset.source===active))});$$('[data-target]').forEach(b=>{const found=Object.keys(links).find(s=>links[s]===+b.dataset.target);b.classList.toggle('linked',found!==undefined);b.querySelector('i').textContent=found!==undefined?+found+1:'·';b.setAttribute('aria-pressed',String(found!==undefined))});root.dataset.links=JSON.stringify(links)}$$('[data-source]').forEach(b=>b.onclick=()=>{active=+b.dataset.source;render()});$$('[data-target]').forEach(b=>b.onclick=()=>{const t=+b.dataset.target;if(links[active]===t)delete links[active];else{Object.keys(links).forEach(s=>{if(links[s]===t)delete links[s]});links[active]=t}render();motion(b,[{transform:'translateX(-4px)'},{transform:'none'}])});render();})();
</script>
