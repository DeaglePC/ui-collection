<div class="ux u181" data-state="initial"><div class="task-name">홈페이지 접근성 점검</div><div class="team"><button class="bin" data-i="0" style="--tone:#5b7867" aria-label="서연에게 배정"><div class="vessel"><i></i><output></output></div><b>서연</b></button><button class="bin" data-i="1" style="--tone:#7f6990" aria-label="민호에게 배정"><div class="vessel"><i></i><output></output></div><b>민호</b></button><button class="bin" data-i="2" style="--tone:#ae7653" aria-label="지수에게 배정"><div class="vessel"><i></i><output></output></div><b>지수</b></button></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let loads=[2,1,3],task=0;const jobs=['홈페이지 접근성 점검','브랜드 가이드 정리','모바일 메뉴 검수','아이콘 세트 정리'];function render(){qa('.bin').forEach((b,i)=>{b.querySelector('i').style.setProperty('--fill',loads[i]/5*100+'%');b.querySelector('output').textContent=loads[i]+' / 5';b.disabled=loads[i]>=5});q('.task-name').textContent=jobs[task%4];state('loads-'+loads.join('-'))}qa('.bin').forEach(b=>b.onclick=()=>{loads[+b.dataset.i]++;task++;render();pulse(q('.task-name'),[{transform:'translateY(-6px)',opacity:.3},{transform:'none',opacity:1}])});render();})();
</script>
