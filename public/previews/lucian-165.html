<style>.u165{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u165 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u165 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u165 button:active{transform:scale(.97)}.u165 small{color:var(--ux-ink-2);font-size:12px}.u165 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u165 .status b{color:var(--ux-ink)}.u165 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u165 svg{display:block;width:100%;overflow:visible}.u165 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u165 .gridline{stroke:var(--ux-line-2);fill:none}.u165 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u165 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u165{border-radius:32px 32px 8px 8px;background:var(--ux-surface-2)}.u165 .forecast{height:195px}.u165 .forecast .band{fill:var(--ux-accent-soft);stroke:var(--ux-accent);stroke-width:.7}.u165 .forecast .past{fill:none;stroke:var(--ux-ink);stroke-width:2.5}.u165 .forecast .future{fill:none;stroke:var(--ux-accent);stroke-width:2.5;stroke-dasharray:5 5}.u165 .controls{justify-content:center}.u165{min-height:0;box-shadow:none}.u165 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u165 .inline{margin-bottom:8px}.u165{background:transparent;border-radius:0}.u165 .forecast{height:200px}.u165 .controls{margin-top:0}.u165 .controls button{border:0;background:transparent}.u165 .controls button[aria-pressed="true"]{background:var(--ux-accent-soft)}.u165 .status{text-align:center}</style>
<div class="ux u165"><svg class="forecast" viewBox="0 0 300 200" aria-hidden="true"><path class="gridline" d="M0 140H300"/><path class="past" d="M6 137L43 110L82 122L118 91L153 95"/><polygon class="band"/><path class="future" d="M153 95L199 77L246 65L294 48"/><line x1="153" x2="153" y1="18" y2="169" class="gridline"/><text x="108" y="188">오늘</text><text x="235" y="188">4주 뒤</text><text x="5" y="188">관측</text></svg><div class="controls" role="group" aria-label="예측 신뢰 수준"><button data-k="80">80% 구간</button><button data-k="95">95% 구간</button></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let k=80,af=0;function draw(){const margin=k===80?14:26,x=[153,199,246,294],y=[95,77,65,48],target=x.map((v,i)=>[v,y[i]-margin*(i/3)]).concat(x.map((v,i)=>[v,y[i]+margin*(i/3)]).reverse()),el=q('.band'),old=(el.getAttribute('points')||target.map(p=>p.join(',')).join(' ')).split(' ').map(p=>p.split(',').map(Number));if(af)cancelAnimationFrame(af);const start=performance.now(),duration=matchMedia('(prefers-reduced-motion:reduce)').matches?0:500;function tick(now){let t=duration?Math.min(1,(now-start)/duration):1;t=1-Math.pow(1-t,3);el.setAttribute('points',target.map((p,i)=>p.map((v,j)=>old[i][j]+(v-old[i][j])*t).join(',')).join(' '));if(t<1)af=requestAnimationFrame(tick)}tick(start);qa('[data-k]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.k===k));q('.status').innerHTML=`예측 120개 · <b>${120-margin}–${120+margin}개</b>`;root.dataset.state=String(k)}qa('[data-k]').forEach(b=>b.onclick=()=>{k=+b.dataset.k;draw()});draw();})();
</script>
