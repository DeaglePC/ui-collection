(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const profiles=[[.9,.8,.55,.65,.8],[.55,.45,.95,.85,.7]],angles=Array.from({length:5},(_,i)=>-Math.PI/2+i*Math.PI*2/5);function pts(v){return angles.map((a,i)=>[150+Math.cos(a)*87*v[i],112+Math.sin(a)*87*v[i]].join(',')).join(' ')}q('.rings').innerHTML=[.25,.5,.75,1].map(v=>`<polygon class="gridline" points="${pts(Array(5).fill(v))}"/>`).join('');let k=0,solo=false;function morph(el,v){if(el._af)cancelAnimationFrame(el._af);let target=pts(v).split(' ').map(x=>x.split(',').map(Number)),from=(el.getAttribute('points')||pts(v)).split(' ').map(x=>x.split(',').map(Number)),start=performance.now(),duration=matchMedia('(prefers-reduced-motion:reduce)').matches?0:420;function tick(now){let t=duration?Math.min(1,(now-start)/duration):1;t=1-Math.pow(1-t,3);el.setAttribute('points',target.map((p,i)=>p.map((n,j)=>from[i][j]+(n-from[i][j])*t).join(',')).join(' '));if(t<1)el._af=requestAnimationFrame(tick)}tick(start)}function draw(){morph(q('.a'),profiles[k]);morph(q('.b'),profiles[1-k]);q('.b').style.opacity=.35;qa('[data-k]').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));q('.status').innerHTML=`${k?'개발 95':'기획 90'}`;root.dataset.state=k+':'+solo}qa('[data-k]').forEach((b,i)=>b.onclick=()=>{k=i;draw()});draw();})();
