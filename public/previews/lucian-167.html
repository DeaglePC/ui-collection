<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{

  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;

  --ux-line:rgba(22,21,27,.09);

  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;

  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<body class="ux">

<style>.u167{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u167 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u167 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u167 button:active{transform:scale(.97)}.u167 small{color:var(--ux-ink-2);font-size:12px}.u167 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u167 .status b{color:var(--ux-ink)}.u167 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u167 svg{display:block;width:100%;overflow:visible}.u167 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u167 .gridline{stroke:var(--ux-line-2);fill:none}.u167 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u167 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u167{border-radius:8px;background:var(--ux-surface);border-left:4px solid #6085BB}.u167 .ticks{display:flex;justify-content:space-between;margin-left:90px;font-size:10px;color:var(--ux-ink-2);margin-top:15px}.u167 .spans{display:flex;flex-direction:column;gap:7px;margin-top:10px}.u167 .span{display:flex;align-items:center;min-height:33px;padding:0;background:transparent;border:0;border-radius:4px;text-align:left;position:relative}.u167 .span .label{width:90px;flex:none;font-size:10px;padding-left:calc(var(--depth)*8px)}.u167 .track{height:19px;flex:1;position:relative;background:var(--ux-surface-2);border-radius:3px}.u167 .span i{height:100%;position:absolute;left:var(--left);width:var(--width);background:var(--col);border-radius:3px;transition:filter .3s,transform .4s}.u167 .span[aria-pressed="true"]{background:var(--ux-accent-soft)}.u167 .span[aria-pressed="true"] i{filter:brightness(1.2);transform:scaleY(1.25)}.u167 .status{border-top:1px solid var(--ux-line-2);padding-top:12px}.u167{min-height:0;box-shadow:none}.u167 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u167 .inline{margin-bottom:8px}.u167{border:0;background:transparent;border-radius:0}.u167 .ticks{margin-top:0;font-size:12px}.u167 .span{min-height:38px}.u167 .span .label{font-size:12px}.u167 .track{background:var(--ux-surface-3);height:16px}.u167 .span i{background:#64859C}.u167 .spans{gap:4px}.u167 .status{padding:0}</style>

<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[['gateway',0,420,0,'#6989C0','GET /answer · 200'],['auth',18,52,1,'#65988B','token.verify · cache hit'],['search',82,170,1,'#8F74B4','vector.query · 12 results'],['rerank',115,92,2,'#B78458','rank.score · model small'],['compose',260,132,1,'#548E91','response.render · 884 bytes']];q('.spans').innerHTML=d.map((x,i)=>`<button class="span" data-k="${i}" style="--depth:${x[3]};--left:${x[1]/420*100}%;--width:${x[2]/420*100}%;--col:${x[4]}" aria-label="${x[0]}, ${x[2]}밀리초"><span class="label">${x[3]?'↳ ':''}${x[0]}</span><span class="track"><i></i></span></button>`).join('');function choose(k){qa('.span').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));q('.status').innerHTML=k<0?'GET /answer':`${d[k][0]} ${d[k][2]} ms · ${d[k][5]}`;root.dataset.state=String(k)}qa('.span').forEach((b,i)=>b.onclick=()=>choose(root.dataset.state===String(i)?-1:i));choose(-1);})();
</script>
