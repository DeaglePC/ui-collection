/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}

<style>.u160{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u160 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u160 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u160 button:active{transform:scale(.97)}.u160 small{color:var(--ux-ink-2);font-size:12px}.u160 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u160 .status b{color:var(--ux-ink)}.u160 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u160 svg{display:block;width:100%;overflow:visible}.u160 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u160 .gridline{stroke:var(--ux-line-2);fill:none}.u160 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u160 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u160{border-radius:6px 6px 30px 30px}.u160 .funnel{display:flex;flex-direction:column;align-items:center;gap:6px}.u160 .funnel button{height:43px;border:0;border-radius:0;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);width:var(--w);background:var(--c);color:white;display:flex;justify-content:space-between;align-items:center;padding:0 20px;transition:width .45s,filter .3s,transform .4s}.u160 .funnel button[aria-pressed="true"]{filter:brightness(1.1);transform:translateX(5px);background:var(--c);color:#fff}.u160 .funnel button:focus-visible{outline:none;filter:brightness(1.25);box-shadow:inset 0 0 0 3px #fff}.u160 .funnel button small{color:#fff}.u160 .status{border-left:3px solid var(--ux-mint);padding-left:12px}.u160{min-height:0;box-shadow:none}.u160 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u160 .inline{margin-bottom:8px}.u160{background:transparent;border-radius:0}.u160 .funnel button{height:48px}.u160 .status{text-align:center}.u160 .funnel button:focus-visible b{text-decoration:underline;text-underline-offset:4px}</style>
<div class="ux u160"><div class="funnel"><button data-k="0" style="--w:100%;--c:#3E759A"><b>방문</b><small>10,000</small></button><button data-k="1" style="--w:88%;--c:#417B8D"><b>상품</b><small>6,200</small></button><button data-k="2" style="--w:73%;--c:#3E887E"><b>장바구니</b><small>2,480</small></button><button data-k="3" style="--w:58%;--c:#287D62"><b>구매</b><small>1,120</small></button></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const d=[['방문',10000,'검색 유입 54%'],['상품',6200,'상세 페이지 이탈 60%'],['장바구니',2480,'배송료 확인 후 이탈 54.8%'],['구매',1120,'최종 전환율 11.2%']];function choose(k){qa('.funnel button').forEach((b,i)=>b.setAttribute('aria-pressed',i===k));q('.status').innerHTML=k<0?'최종 전환율 <b>11.2%</b>':`${d[k][2]}`;root.dataset.state=String(k)}qa('.funnel button').forEach((b,i)=>b.onclick=()=>choose(root.dataset.state===String(i)?-1:i));choose(-1);})();
</script>
