<style>

.u003-file{display:flex;align-items:center;gap:14px;width:268px;padding:14px 16px;border-radius:18px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 18px 30px -22px var(--ux-shadow-strong);transform-origin:50% 100%;transition:transform .7s var(--ux-spring),opacity .5s var(--ux-ease),filter .5s var(--ux-ease)}

.u003-row{position:relative;height:64px;width:268px}
.u003-btn{--p:0;position:absolute;inset:0;border:0;border-radius:999px;padding:0;overflow:hidden;isolation:isolate;background:color-mix(in srgb,var(--ux-danger) 12%,var(--ux-surface));color:var(--ux-danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ux-danger) 40%,transparent);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .5s var(--ux-spring),opacity .4s var(--ux-ease),width .6s var(--ux-ease)}
.u003-btn:focus-visible{outline:2px solid var(--ux-danger);outline-offset:4px}
.u003-lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.u003-lab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 차오르는 채움: 같은 문구를 흰색으로 한 겹 더 두고 왼쪽부터 잘라 보여 줍니다 */
.u003-fill{position:absolute;inset:0;background:var(--ux-danger);color:var(--ux-accent-ink);clip-path:inset(0 calc(100% - var(--p) * 100%) 0 0 round 999px)}
.u003-btn.is-holding{transform:scale(.97);animation:u003-shake .12s linear infinite;animation-play-state:var(--shake,paused)}
@keyframes u003-shake{0%,100%{translate:0 0}25%{translate:-.6px .3px}75%{translate:.6px -.3px}}

.u003-undo:active{transform:scale(.94)}

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var btn = root.querySelector('.u003-btn');
  var file = root.querySelector('.u003-file');
  var done = root.querySelector('.u003-done');
  var undo = root.querySelector('.u003-undo');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var HOLD = 1200;
  var p = 0, raf = 0, last = 0, holding = false, finished = false;

  function set(v) { p = v; btn.style.setProperty('--p', v.toFixed(4)); }
  // 누르는 동안 채움이 차오르고, 손을 떼면 같은 속도의 두 배로 빠지며 돌아갑니다
  function tick(now) {
    if (!root.isConnected) return;
    var dt = now - (last || now);
    last = now;
    if (holding) set(Math.min(1, p + dt / HOLD));
    else set(Math.max(0, p - dt / (HOLD / 2.4)));
    btn.style.setProperty('--shake', holding && p > 0.55 && !rm ? 'running' : 'paused');
    if (p >= 1 && holding) { complete(); return; }
    if (holding || p > 0) raf = requestAnimationFrame(tick);
    else { raf = 0; last = 0; }
  }
  function start() {
    if (finished) return;
    holding = true;
    btn.classList.add('is-holding');
    if (!raf) { last = 0; raf = requestAnimationFrame(tick); }
  }
  function stop() {
    holding = false;
    btn.classList.remove('is-holding');
    if (!raf && p > 0) raf = requestAnimationFrame(tick);
  }
  function complete() {
    holding = false; finished = true; raf = 0; last = 0;
    btn.classList.remove('is-holding');
    file.classList.add('is-gone');
    btn.classList.add('is-gone');
    btn.setAttribute('tabindex', '-1');
    done.classList.add('is-on');
    undo.focus({ preventScroll: true });
  }
  function restore() {
    finished = false;
    set(0);
    file.classList.remove('is-gone');
    btn.classList.remove('is-gone');
    btn.removeAttribute('tabindex');
    done.classList.remove('is-on');
    btn.focus({ preventScroll: true });
  }
  btn.addEventListener('pointerdown', function (e) { if (e.button === 0) { btn.setPointerCapture(e.pointerId); start(); } });
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('lostpointercapture', stop);
  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // 키보드는 Space나 Enter를 누르고 있는 동안 차오릅니다
  btn.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!e.repeat) start(); }
  });
  btn.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') stop(); });
  btn.addEventListener('blur', stop);
  btn.addEventListener('click', function (e) { e.preventDefault(); });
  undo.addEventListener('click', restore);
})();
</script>
