/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;

/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}

.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */

  }
}

<style>

.u178 .muted{color:var(--ux-ink-2);font-size:12px}.u178 .eyebrow{font:600 10px/1.2 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ux-ink-2)}

<div class="ux u178" data-state="initial"><div class="files"><button class="file" data-i="0" aria-pressed="false"><i>FIG</i><span>브랜드.fig</span></button><button class="file" data-i="1" aria-pressed="false"><i>PDF</i><span>기획서.pdf</span></button><button class="file" data-i="2" aria-pressed="false"><i>SVG</i><span>심볼.svg</span></button></div><div class="dock" hidden><span class="count" aria-live="polite"></span><button class="archive">보관 ↗</button></div><button class="restore" hidden>보관 취소 ↶</button></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};const selected=new Set();let archived=0;function render(){qa('.file').forEach(b=>b.setAttribute('aria-pressed',selected.has(b.dataset.i)));q('.count').textContent=selected.size+'개 선택';q('.dock').hidden=!selected.size;q('.restore').hidden=!archived;state('selected-'+[...selected].join('-')+'-archived-'+archived)}qa('.file').forEach(b=>b.onclick=()=>{selected.has(b.dataset.i)?selected.delete(b.dataset.i):selected.add(b.dataset.i);render()});q('.archive').onclick=()=>{archived+=selected.size;qa('.file').filter(b=>selected.has(b.dataset.i)).forEach(b=>b.hidden=true);selected.clear();render()};q('.restore').onclick=()=>{qa('.file').forEach(b=>b.hidden=false);selected.clear();archived=0;render()};})();
</script>
