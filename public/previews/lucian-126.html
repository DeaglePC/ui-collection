}

    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;

    --ux-glass:rgba(255,255,255,.07);

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};const source=$('textarea');function render(){let h='',list=false;for(const l of source.value.split('\n')){const t=esc(l).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');if(l.startsWith('- ')){if(!list){h+='<ul>';list=true}h+='<li>'+t.slice(2)+'</li>'}else{if(list){h+='</ul>';list=false}h+=l.startsWith('# ')?'<h2>'+t.slice(2)+'</h2>':l?'<p>'+t+'</p>':''}}$('article').innerHTML=h+(list?'</ul>':'')}function edit(on){source.hidden=!on;$('article').hidden=on;$('[data-edit]').textContent=on?'미리보기':'편집';$('[data-edit]').setAttribute('aria-pressed',String(on));if(on)source.focus();else motion($('article'),[{transform:'translateY(4px)',opacity:.8},{transform:'none',opacity:1}])}source.oninput=render;source.onkeydown=e=>{if(e.key==='Escape')edit(false)};$('[data-edit]').onclick=()=>edit(source.hidden);render();})();
</script>
