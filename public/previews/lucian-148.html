    --ux-mint:#7EE8C0;

    --ux-glass:rgba(255,255,255,.07);

/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;

/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<!-- @meta {"title": "출처 서식 조판", "category": "문서·데이터 편집", "summary": "저자·연도·제목·출판사 칸으로 참고문헌을 조판하는 편집기입니다. 칸을 고치면 인용이 바로 다시 짜이고, 버튼으로 APA와 MLA 서식을 오갑니다.", "hint": "인용 안의 글자를 고치거나 APA 버튼을 눌러 보세요", "shape": "square", "fluid": true, "hue": "#3A6AAB", "hue2": "#22C3A6", "tags": ["citation-formatter", "editing", "interactive"]} -->

<style>
.u148{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u148 button,.u148 input,.u148 textarea,.u148 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u148 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u148 input,.u148 textarea,.u148 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u148 .quiet{color:var(--ux-ink-2)}.u148 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u148 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u148 [hidden]{display:none!important}.u148 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u148 *{animation:none!important;transition:none!important}}
.u148{background:var(--ux-surface);border-top:3px solid var(--ux-warn);box-shadow:4px 4px 0 var(--ux-surface-3);padding:24px}.u148 .citation{font:18px/2.1 Georgia,'Apple SD Gothic Neo',serif;min-height:136px;margin:0;overflow-wrap:anywhere}.u148 .chunk{display:inline-block;max-width:100%;vertical-align:baseline;margin-right:4px}.u148 input{font:inherit;display:inline-block;max-width:100%;min-height:44px;border:0;border-bottom:1px dotted var(--ux-line-2);border-radius:0;padding:0;background:transparent;color:inherit}.u148 [data-title]{font-style:italic}.u148 [data-style]{display:block;margin:17px 0 0 auto;background:transparent;border:1px solid var(--ux-line-2);font-size:12px;min-width:60px}.u148 input:focus{background:var(--ux-surface-2)}

<div class="ux u148"><p class="citation" aria-label="조판된 출처"><span class="chunk"><input data-author value="김서윤" aria-label="저자">. </span><span class="chunk">(<input data-year value="2024" inputmode="numeric" maxlength="4" aria-label="연도">). </span><span class="chunk"><input data-title value="도시의 정원" aria-label="책 제목">. </span><span class="chunk"><input data-publisher value="느린책" aria-label="출판사">.</span></p><button data-style aria-label="MLA 서식으로 변경">APA</button></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};let style='APA';const fields={author:$('[data-author]'),year:$('[data-year]'),title:$('[data-title]'),publisher:$('[data-publisher]')};function size(i){const c=document.createElement('canvas').getContext('2d');c.font=getComputedStyle(i).font;const n=c.measureText(i.value).width;i.style.width=Math.max(24,Math.min(260,Math.ceil(n)+1))+'px'}function render(){const sequence=style==='APA'?[['author','','. '],['year','(','). '],['title','','. '],['publisher','','.']]:[['author','','. '],['title','','. '],['publisher','',', '],['year','','.']];$('.citation').replaceChildren(...sequence.map(([k,pre,post])=>{const span=document.createElement('span');span.className='chunk';span.append(document.createTextNode(pre),fields[k],document.createTextNode(post));return span}));$('[data-style]').textContent=style;$('[data-style]').setAttribute('aria-label',(style==='APA'?'MLA':'APA')+' 서식으로 변경');root.dataset.format=style}Object.values(fields).forEach(i=>{size(i);i.oninput=()=>{size(i);root.dataset.citation=Object.values(fields).map(x=>x.value).join('|')}});$('[data-style]').onclick=()=>{style=style==='APA'?'MLA':'APA';render();motion($('.citation'),[{transform:'translateY(4px)'},{transform:'none'}])};render();})();
</script>
