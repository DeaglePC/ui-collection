<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var inp = root.querySelector('.u285-in'), rl = root.querySelector('.u285-rl'), go = root.querySelector('.u285-go'), ls = root.querySelector('.u285-ls'), ct = root.querySelector('.u285-ct');
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var RL = ['편집', '보기'];
  // [이름, 이메일, 역할(-1이면 소유자)]
  var M = [['김서연', 'seoyeon@studio.kr', -1], ['이준호', 'junho@studio.kr', 0], ['박하은', 'haeun@studio.kr', 1]];
  var COL = ['#6366F1', '#EC4899', '#0EA5E9', '#10B981', '#F59E0B'], n = 0, role = 0;
  function count() { ct.textContent = n + '명'; }
  function row(name, mail, r, col, pending) {
    var li = document.createElement('li'); li.className = 'u285-it';
    li.innerHTML = '<div><div class="u285-rw"><span class="u285-av" style="--c:' + col + '"><span></span></span><div class="u285-tx"><b></b><small></small></div><span class="u285-st"></span><button type="button" class="u285-rb"></button></div></div>';
    li.querySelector('.u285-av span').textContent = name.charAt(0).toUpperCase(); li.querySelector('b').textContent = name; li.querySelector('small').textContent = mail;
    var st = li.querySelector('.u285-st'), rb = li.querySelector('.u285-rb'), cur = r;
    function rs() { rb.textContent = cur < 0 ? '소유자' : RL[cur]; rb.disabled = cur < 0; if (cur >= 0) rb.setAttribute('aria-label', name + ' ' + RL[cur] + ' 역할 바꾸기'); }
    rb.addEventListener('click', function () { if (cur < 0) return; cur = 1 - cur; rs(); rb.classList.remove('is-fl'); void rb.offsetWidth; rb.classList.add('is-fl'); });
    rs();
    if (pending) { st.className = 'u285-st pd'; st.textContent = '대기 중'; li.querySelector('.u285-av').style.setProperty('--k', 0); }
    else st.hidden = true;
    return { li: li, st: st, av: li.querySelector('.u285-av') };
  }
  M.forEach(function (m, i) { ls.appendChild(row(m[0], m[1], m[2], COL[i]).li); n++; });
  count();
  function rlab() { rl.firstChild.textContent = RL[role]; }
  rl.addEventListener('click', function () { role = 1 - role; rlab(); });
  inp.addEventListener('input', function () { go.disabled = !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim()); });
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !go.disabled) go.click(); });
