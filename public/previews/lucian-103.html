<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "경로 탐색 크럼", "category": "공간·일정·디자인 도구", "summary": "폴더 경로를 한 줄로 보여 주는 탐색 막대입니다. 상위 폴더를 누르면 그 위치로 올라가고, 아래 목록에서 하위 폴더를 골라 다시 내려갈 수 있습니다.", "hint": "경로의 ‘프로젝트’를 누른 뒤 아래 폴더를 골라 보세요", "shape": "square", "fluid": true, "hue": "#8A55C9", "hue2": "#3D8BFF", "tags": ["breadcrumb", "native", "spatial"]} -->

<style>
.u103{width:100%;max-width:400px;min-width:0;font-size:13px}.u103 button{font:inherit;color:inherit;cursor:pointer}.u103 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u103 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u103{padding:16px 0;max-width:380px}.u103 nav{display:flex;align-items:center;flex-wrap:wrap;gap:3px;border-bottom:1px solid var(--ux-line-2);padding-bottom:10px}.u103 button{border:0;background:transparent;min-height:44px;padding:8px 10px;border-radius:5px}.u103 nav button[aria-current=page]{font-weight:700;color:var(--ux-accent)}.u103 nav span{color:var(--ux-ink-3)}.u103 .places{display:flex;gap:12px;padding-top:15px;min-height:74px}.u103 .place{flex:1;text-align:left;border:1px solid var(--ux-line-2);background:var(--ux-surface);display:flex;gap:10px;align-items:center}.u103 .place span{font-size:20px;color:var(--ux-accent)}.u103 .empty{margin:14px 10px;color:var(--ux-ink-2);font-size:13px}
</style>
<div class="ux u103"><nav aria-label="문서 경로"></nav><div class="places"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const tree={name:'작업실',children:[{name:'프로젝트',children:[{name:'오로라',children:[{name:'원고',children:[]},{name:'표지',children:[]}]},{name:'아카이브',children:[]}]},{name:'개인 기록',children:[]}]};let path=[tree,tree.children[0],tree.children[0].children[0]];function paint(){q('nav').innerHTML=path.map((x,i)=>`<button data-i="${i}" ${i===path.length-1?'aria-current="page"':''}>${x.name}</button>${i<path.length-1?'<span aria-hidden="true">/</span>':''}`).join('');q('.places').innerHTML=path.at(-1).children.map((x,i)=>`<button class="place" data-child="${i}"><span aria-hidden="true">▱</span>${x.name}</button>`).join('')||'<p class="empty">빈 폴더</p>';qa('[data-i]').forEach(b=>b.onclick=()=>{path=path.slice(0,+b.dataset.i+1);paint()});qa('[data-child]').forEach(b=>b.onclick=()=>{path.push(path.at(-1).children[+b.dataset.child]);paint()})}root.onkeydown=e=>{if(e.key==='Escape'){path=[tree,tree.children[0],tree.children[0].children[0]];paint();q('[aria-current]').focus()}};paint();})();
</script>
