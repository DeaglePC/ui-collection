<style>
.u067{position:relative;width:340px;height:460px;display:flex;flex-direction:column;align-items:center;padding:32px 24px 24px;border-radius:30px;background:var(--ux-surface);box-shadow:0 0 0 1px var(--ux-line),0 30px 60px -36px var(--ux-shadow-strong);overflow:hidden;text-align:center}
.u067-dial{position:relative;width:168px;height:168px;flex:none}
.u067-dial>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.u067-dial circle{fill:none;stroke-width:8}
.u067-dial .t{stroke:var(--ux-surface-3)}
.u067-dial .p{stroke:var(--ux-warn);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p,1) * 100);transition:stroke .4s}
.u067.is-open .u067-dial .p{stroke:var(--ux-mint)}
.u067-ticks{position:absolute;inset:16px;border-radius:50%;background:repeating-conic-gradient(var(--ux-line-2) 0 1deg,transparent 1deg 15deg);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 68%,transparent 69%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 68%,transparent 69%)}
.u067-lock{position:absolute;left:50%;top:50%;width:62px;height:70px;margin:-40px 0 0 -31px}
.u067-lock svg{width:100%;height:100%;overflow:visible}
.u067-sh{fill:none;stroke:var(--ux-ink);stroke-width:6;stroke-linecap:round;transform-origin:46px 30px;transition:transform .7s var(--ux-spring)}
.u067.is-open .u067-sh{transform:translateY(-8px) rotate(28deg)}
.u067-bd{fill:var(--ux-ink);transition:fill .4s}
.u067.is-open .u067-bd{fill:var(--ux-mint)}
.u067-kh{fill:var(--ux-surface)}
.u067-time{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;font-size:15px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--ux-ink-2)}
.u067-time span,.u067-time b{display:flex;flex-direction:column;height:20px;overflow:hidden;font-weight:inherit}
.u067-time i{display:block;font-style:normal;line-height:20px;transform:translateY(calc(var(--d) * -20px));transition:transform .45s var(--ux-spring)}
.u067-time b{line-height:20px}
.u067 h3{margin:22px 0 6px;font-size:22px;font-weight:850;letter-spacing:-.045em}
.u067 p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ux-ink-3)}
.u067-t{position:relative;height:30px;width:100%;margin:22px 0 6px}
.u067-t h3{margin:0}
.u067-t>*{position:absolute;left:0;right:0;transition:opacity .35s,transform .5s var(--ux-spring)}
.u067-t .b{opacity:0;transform:translateY(10px)}
.u067.is-open .u067-t .a{opacity:0;transform:translateY(-10px)}
.u067.is-open .u067-t .b{opacity:1;transform:none}
.u067-acts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:auto}
.u067-b{height:52px;border:0;border-radius:16px;font-size:15px;font-weight:760;transition:transform .3s var(--ux-spring),background-color .4s,color .4s,opacity .3s}
.u067-b:active{transform:scale(.97)}
.u067-b:focus-visible{outline:2px solid var(--ux-accent);outline-offset:2px}
.u067-in{background:var(--ux-surface-2);color:var(--ux-ink-3)}
.u067-in[aria-disabled="false"]{background:var(--ux-ink);color:var(--ux-page)}
.u067-mail{background:none;box-shadow:inset 0 0 0 1.5px var(--ux-line-2);color:var(--ux-ink)}
.u067-mail.sent{color:var(--ux-mint);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ux-mint) 50%,transparent)}
</style>
<div class="ux u067">

  <p class="u067-p">비밀번호를 5번 틀려서 보호 중이에요.<br>시간이 지나면 다시 로그인할 수 있어요.</p>

</div>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  var dial = root.querySelector('.u067-dial'), time = root.querySelector('.u067-time'), p = root.querySelector('.u067-p');
  var inB = root.querySelector('.u067-in'), mail = root.querySelector('.u067-mail');
  var LOCK = 15, t0 = 0, raf = 0, shown = '';
  // 숫자 자리마다 0–9를 세로로 쌓아 두고, 바뀐 자리만 위로 굴립니다
  function digits(str) {
    if (str === shown) return;
    if (time.children.length !== str.length) {
      time.innerHTML = str.split('').map(function (c) {
        if (c < '0' || c > '9') return '<b>' + c + '</b>';
        var h = ''; for (var n = 0; n < 10; n++) h += '<i>' + n + '</i>';
        return '<span style="--d:' + c + '">' + h + '</span>';
      }).join('');
    } else str.split('').forEach(function (c, k) { if (c >= '0' && c <= '9') time.children[k].style.setProperty('--d', c); });
    shown = str;
  }
  function tick(now) {
    if (!root.isConnected) return;
    var left = Math.max(0, LOCK - (now - t0) / 1000), s = Math.ceil(left);
    dial.style.setProperty('--p', (left / LOCK).toFixed(4));
    digits('0:' + ('0' + s).slice(-2));
    dial.setAttribute('aria-label', '남은 시간 ' + s + '초');
    if (left <= 0) { unlock(); return; }
    raf = requestAnimationFrame(tick);
  }
  function unlock() {
    root.classList.add('is-open');
    inB.setAttribute('aria-disabled', 'false');
    p.innerHTML = '보안을 위해 이번에는 비밀번호를<br>천천히 확인하고 입력하세요.';
  }
  function lock() {
    cancelAnimationFrame(raf);
    root.classList.remove('is-open');
    inB.setAttribute('aria-disabled', 'true');
    mail.classList.remove('sent'); mail.textContent = '재설정 메일 보내기';
    p.innerHTML = '비밀번호를 5번 틀려서 보호 중이에요.<br>시간이 지나면 다시 로그인할 수 있어요.';
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }
  inB.addEventListener('click', function () { if (inB.getAttribute('aria-disabled') === 'false') lock(); });
  mail.addEventListener('click', function () {
    mail.classList.add('sent');
    mail.textContent = 'seoyeon@example.com로 보냈어요';
  });
  digits('0:15');
  lock();
})();
</script>
