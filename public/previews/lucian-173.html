<style>.u173{width:100%;max-width:390px;padding:16px;position:relative;font-size:13px;line-height:1.45}.u173 button{border:1px solid var(--ux-line-2);background:var(--ux-surface);padding:8px 12px;border-radius:10px;min-height:44px;font-size:12px;transition:background .2s,transform .3s var(--ux-ease)}.u173 button[aria-pressed="true"]{background:var(--ux-accent-soft);border-color:var(--ux-accent)}.u173 button:active{transform:scale(.97)}.u173 small{color:var(--ux-ink-2);font-size:12px}.u173 .status{margin-top:10px;color:var(--ux-ink-2);font-size:12px;line-height:1.5}.u173 .status b{color:var(--ux-ink)}.u173 .controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.u173 svg{display:block;width:100%;overflow:visible}.u173 svg text{font-family:inherit;fill:var(--ux-ink-2);font-size:11px}.u173 .gridline{stroke:var(--ux-line-2);fill:none}.u173 input[type="range"]{width:100%;height:44px;accent-color:var(--ux-accent);margin:0}.u173 .inline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.u173{background:transparent;box-shadow:none;padding:16px}.u173 .dial{width:150px;height:150px;border-radius:50%;margin:3px auto 12px;position:relative;background:var(--ux-surface);border:7px solid var(--ux-surface-3);box-shadow:0 8px 20px var(--ux-shadow)}.u173 .dial .ticks{position:absolute;inset:5px}.u173 .dial .ticks i{position:absolute;left:50%;top:0;width:1px;height:7px;background:var(--ux-ink-3);transform-origin:0 64px;transform:rotate(var(--r))}.u173 .north{position:absolute;top:11px;left:calc(50% - 4px);font-weight:850;color:var(--ux-danger);font-size:10px}.u173 .south{position:absolute;bottom:11px;left:calc(50% - 4px);font-size:10px;color:var(--ux-ink-2)}.u173 .needle{position:absolute;left:calc(50% - 5px);top:17px;height:51px;width:10px;transform-origin:50% 100%;transform:rotate(var(--r));transition:transform .65s var(--ux-spring);clip-path:polygon(50% 0,100% 86%,50% 100%,0 86%);background:var(--ux-danger)}.u173 .reference{background:var(--ux-accent-2);opacity:.6;width:6px;left:calc(50% - 3px)}.u173 .hub{position:absolute;width:10px;height:10px;background:var(--ux-ink);border-radius:50%;top:calc(50% - 5px);left:calc(50% - 5px)}.u173 .readout{position:static;display:block;text-align:center;font-size:19px;font-weight:850;margin:-6px 0 8px}.u173 .controls{justify-content:center}.u173 .status{text-align:center;margin-top:8px;min-height:20px}.u173 label{display:block;font-size:11px;color:var(--ux-ink-2)}.u173{min-height:0;box-shadow:none}.u173 .status{background:transparent;border:0;padding:0;min-height:0;height:auto}.u173 .inline{margin-bottom:8px}.u173{padding:12px}.u173 .dial{box-shadow:none;margin:0 auto 8px}.u173 .controls{margin-top:0}.u173 .calibrate{border:0;background:var(--ux-surface-3)}.u173 .status{margin-top:6px}</style>
<div class="ux u173"><div class="dial" role="img" aria-label="방향 측정 나침반"><div class="ticks"></div><span class="north">N</span><span class="south">S</span><i class="needle reference"></i><i class="needle measured"></i><i class="hub"></i></div><label>기준 방향<input class="range" type="range" min="0" max="359" value="45" aria-label="기준 방향 도"></label><div class="controls"><button class="calibrate">편차 보정</button></div><div class="status" aria-live="polite"></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let offset=12;q('.ticks').innerHTML=Array.from({length:24},(_,i)=>`<i style="--r:${i*15}deg"></i>`).join('');function draw(){let raw=+q('.range').value,measured=(raw+offset+360)%360;q('.reference').style.setProperty('--r',raw+'deg');q('.measured').style.setProperty('--r',measured+'deg');q('.dial').setAttribute('aria-label',`기준 ${raw}도, 측정 ${measured}도`);q('.status').innerHTML=`측정 ${measured}° · 편차 ${offset?'+'+offset:0}°`;q('.calibrate').setAttribute('aria-pressed',offset===0);q('.calibrate').textContent=offset===0?'보정됨':'편차 보정';root.dataset.state=raw+':'+offset}q('.range').oninput=draw;q('.calibrate').onclick=()=>{offset=offset===0?12:0;draw()};draw();})();
</script>
