/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

body{display:grid;place-items:center;padding:28px 16px;}

<body class="ux">
<!-- @meta {"title": "시간대 회의 교집합", "category": "공간·일정·디자인 도구", "summary": "서울·런던·뉴욕의 시각을 한 줄로 맞춰 보는 회의 시간 도구입니다. UTC 시각을 옮기면 세 도시의 시계와 근무 여부가 함께 바뀝니다.", "hint": "UTC 슬라이더를 움직여 세 도시가 모두 근무 중인 시간을 찾아보세요", "shape": "square", "fluid": true, "hue": "#8A55C9", "hue2": "#3D8BFF", "tags": ["timezone", "native", "spatial"]} -->

<style>
.u108{width:100%;max-width:400px;min-width:0;font-size:13px}.u108 button{font:inherit;color:inherit;cursor:pointer}.u108 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u108 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u108{padding:10px 4px;max-width:380px}.u108 .zone{padding:16px 0;display:grid;grid-template-columns:50px 1fr 68px;gap:14px;align-items:center;border-bottom:1px solid var(--ux-line)}.u108 .city{font-weight:650}.u108 .clock{font-size:19px;font-variant-numeric:tabular-nums;text-align:right}.u108 .clock small{display:block;color:var(--ux-ink-2);font-size:11px;margin-top:3px}.u108 .hours{height:16px;background:var(--ux-surface-3);position:relative;border-radius:3px;overflow:hidden}.u108 .work{position:absolute;inset:0 auto 0 37.5%;width:37.5%;background:var(--ux-accent-soft)}.u108 .needle{position:absolute;top:0;bottom:0;width:3px;background:var(--ux-accent);left:var(--h)}.u108 label{display:flex;align-items:center;gap:13px;margin-top:22px;color:var(--ux-ink-2)}.u108 label input{flex:1;height:26px}.u108 .utc{font-variant-numeric:tabular-nums;min-width:40px}
</style>
<div class="ux u108"><div class="zones"></div><label>UTC<input class="time" type="range" min="0" max="23" value="10" aria-label="UTC 회의 시각"><output class="utc">10:00</output></label><output class="sr result" aria-live="polite"></output></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const zones=[['서울','Asia/Seoul'],['런던','Europe/London'],['뉴욕','America/New_York']];q('.zones').innerHTML=zones.map(([name])=>`<div class="zone"><span class="city">${name}</span><div class="hours"><span class="work"></span><span class="needle"></span></div><span class="clock"></span></div>`).join('');function paint(){const h=+q('.time').value,date=new Date('2026-10-12T'+String(h).padStart(2,'0')+':00:00Z');let ok=0;qa('.zone').forEach((r,i)=>{const hour=+new Intl.DateTimeFormat('en-GB',{timeZone:zones[i][1],hour:'2-digit',hourCycle:'h23'}).format(date),good=hour>=9&&hour<18;r.querySelector('.clock').innerHTML=String(hour).padStart(2,'0')+':00<small>'+(good?'근무':'휴식')+'</small>';r.style.setProperty('--h',hour/24*100+'%');if(good)ok++});q('.utc').textContent=String(h).padStart(2,'0')+':00';q('.result').textContent='업무 시간에 있는 지역 '+ok+' / 3'}q('.time').oninput=paint;paint();})();
</script>
