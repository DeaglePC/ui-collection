.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}

<div class="ux u176" data-state="initial"><div class="poster"><strong>Quiet<br>forms.</strong><i class="orb"></i></div><div class="version-rail"><div class="film"><button class="v" data-v="0" aria-pressed="false">v1</button><button class="v" data-v="1" aria-pressed="false">v2</button><button class="v" data-v="2" aria-pressed="true">v3</button></div><button class="restore" disabled>현재 버전</button></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling;const q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const state=s=>root.dataset.state=s;const pulse=(el,frames,duration=450)=>{if(!reduced)el.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});};let selected=2,live=2;const versions=[['#dadfd6','#416252','rotate(-12deg)','22%'],['#e9d1c8','#a45464','rotate(8deg)','50%'],['#e8ddc8','#bb614b','rotate(0deg)','50%']];function render(){const v=versions[selected];q('.poster').style.background=v[0];q('.orb').style.background=v[1];q('.orb').style.borderRadius=v[3];q('.poster strong').style.transform=v[2];qa('.v').forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));q('.restore').disabled=selected===live;q('.restore').textContent=selected===live?'현재 버전':'이 버전 복원';state('preview-'+selected+'-live-'+live)}qa('.v').forEach(b=>b.onclick=()=>{selected=+b.dataset.v;render()});q('.restore').onclick=()=>{live=selected;render();pulse(q('.poster'),[{transform:'translateY(-5px)'},{transform:'none'}])};})();
</script>
