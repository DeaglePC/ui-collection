<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}
</style>
</head>
<body class="ux">
<!-- @meta {"title": "벡터 패스 펜", "category": "공간·일정·디자인 도구", "summary": "두 제어점으로 곡선 모양을 다듬는 펜 도구입니다. 점선 끝의 손잡이를 끌면 곡선이 바로 휘어지고, 키보드로도 점을 옮길 수 있습니다.", "hint": "동그란 제어점을 끌어 보세요. 점에 초점을 두고 ↑/↓로도 움직이고 Esc로 되돌립니다", "shape": "square", "fluid": true, "hue": "#A66A17", "hue2": "#3D8BFF", "tags": ["path-pen", "native", "spatial"]} -->
<!-- @demo [["wait", 500], ["key", ".u114 .handle.a", 0, "ArrowDown", 4, 240], ["wait", 600], ["key", ".u114 .handle.b", 0, "ArrowUp", 4, 240], ["wait", 1000], ["key", ".u114 .handle.a", 0, "Escape", 1, 300], ["key", ".u114 .handle.b", 0, "Escape", 1, 900]] -->
<!-- @en {"title": "Vector pen path", "summary": "A pen tool for shaping a curve with two control points. Drag a handle at the end of a dotted line and the curve bends with it; the points also move from the keyboard.", "hint": "Drag a round control point. With it focused, ↑/↓ move it too, and Esc resets","map":[
  ["벡터 곡선", "Vector curve"],
  ["첫 제어점", "First control point"],
  ["둘째 제어점", "Second control point"]
]} -->
<style>
.u114{width:100%;max-width:400px;min-width:0;font-size:13px}.u114 button{font:inherit;color:inherit;cursor:pointer}.u114 input[type=range]{min-width:0;width:100%;accent-color:var(--ux-accent)}.u114 .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u114 .art{height:220px;background:var(--ux-surface-2);border:1px solid var(--ux-line-2);border-radius:4px;position:relative}.u114 svg{width:100%;height:100%}.u114 .path{fill:none;stroke:var(--ux-accent);stroke-width:4;stroke-linecap:round}.u114 .guide{fill:none;stroke:var(--ux-ink-2);stroke-width:1;stroke-dasharray:4 4}.u114 rect{fill:var(--ux-accent)}.u114 .handle{position:absolute;left:calc(var(--cx) - 22px);top:calc(var(--cy) - 22px);width:44px;height:44px;border:0;padding:0;background:transparent;touch-action:none;cursor:ns-resize}.u114 .handle:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid var(--ux-accent);background:var(--ux-surface);left:15px;top:15px}
</style>
<div class="ux u114"><div class="art"><svg viewBox="0 0 360 210" preserveAspectRatio="none" aria-label="벡터 곡선"><path class="guide"/><path class="path"/><rect x="32" y="102" width="10" height="10"/><rect x="314" y="102" width="10" height="10"/></svg><button class="handle a" data-i="0" style="--cx:31.94%;--cy:19.05%" aria-label="첫 제어점" role="slider" aria-valuemin="25" aria-valuemax="185" aria-valuenow="40"></button><button class="handle b" data-i="1" style="--cx:68.06%;--cy:76.19%" aria-label="둘째 제어점" role="slider" aria-valuemin="25" aria-valuemax="185" aria-valuenow="160"></button></div></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];let v=[40,160];function paint(){q('.path').setAttribute('d',`M37 107 C115 ${v[0]} 245 ${v[1]} 319 107`);q('.guide').setAttribute('d',`M37 107L115 ${v[0]}M319 107L245 ${v[1]}`);qa('.handle').forEach((b,i)=>{b.style.setProperty('--cy',v[i]/210*100+'%');b.setAttribute('aria-valuenow',v[i])})}function set(i,n){v[i]=Math.max(25,Math.min(185,Math.round(n/5)*5));paint()}qa('.handle').forEach((b,i)=>{b.onkeydown=e=>{if(['ArrowUp','ArrowDown','Home','End','Escape'].includes(e.key)){e.preventDefault();if(e.key==='Escape'){v=[40,160];paint();return}set(i,e.key==='Home'?25:e.key==='End'?185:v[i]+(e.key==='ArrowDown'?5:-5))}};b.onpointerdown=e=>b.setPointerCapture(e.pointerId);b.onpointermove=e=>{if(b.hasPointerCapture(e.pointerId)){const r=q('.art').getBoundingClientRect();set(i,(e.clientY-r.top)/r.height*210)}}});paint();})();
</script>

</body>
