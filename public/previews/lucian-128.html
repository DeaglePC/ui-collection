<style>
/* lucianLabs UI 요소 — 공통 테마 토큰 (라이트 / 다크)
   라이트 기본값 → 시스템이 다크면 다크 → data-theme으로 명시하면 그 값을 우선합니다.
   요소 CSS는 --ux-* 토큰만 참조하므로, 프로젝트 테마 변수에 이 값을 매핑하면 됩니다. */
:root{
  color-scheme:light;
  --ux-page:#F4F2EE;
  --ux-surface:#FFFFFF;
  --ux-surface-2:#F5F3EF;
  --ux-surface-3:#EAE7E1;
  --ux-ink:#16151B;
  --ux-ink-2:#57535F;
  --ux-ink-3:#8E8A97;
  --ux-line:rgba(22,21,27,.09);
  --ux-line-2:rgba(22,21,27,.17);
  --ux-accent:#6A57F2;
  --ux-accent-2:#2F8FE0;
  --ux-accent-soft:rgba(106,87,242,.12);
  --ux-accent-ink:#FFFFFF;
  --ux-mint:#119C72;
  --ux-warn:#D6731E;
  --ux-danger:#D93A55;
  --ux-glass:rgba(255,255,255,.58);
  --ux-glass-line:rgba(255,255,255,.85);
  --ux-shadow:rgba(40,30,80,.14);
  --ux-shadow-strong:rgba(40,30,80,.3);
  --ux-grad:linear-gradient(120deg,#7B61FF,#3D8BFF 55%,#1FB89A);
  --ux-ease:cubic-bezier(.2,.8,.2,1);
  --ux-spring:cubic-bezier(.34,1.45,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ux-page:#07080D;
    --ux-surface:#13141C;
    --ux-surface-2:#1A1B25;
    --ux-surface-3:#252632;
    --ux-ink:#F4F0E8;
    --ux-ink-2:rgba(244,240,232,.68);
    --ux-ink-3:rgba(244,240,232,.42);
    --ux-line:rgba(255,255,255,.08);
    --ux-line-2:rgba(255,255,255,.16);
    --ux-accent:#B7A4FF;
    --ux-accent-2:#7DB4FF;
    --ux-accent-soft:rgba(183,164,255,.15);
    --ux-accent-ink:#0B0C12;
    --ux-mint:#7EE8C0;
    --ux-warn:#FFB26B;
    --ux-danger:#FF7D8C;
    --ux-glass:rgba(255,255,255,.07);
    --ux-glass-line:rgba(255,255,255,.18);
    --ux-shadow:rgba(0,0,0,.45);
    --ux-shadow-strong:rgba(0,0,0,.72);
    --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ux-page:#07080D;
  --ux-surface:#13141C;
  --ux-surface-2:#1A1B25;
  --ux-surface-3:#252632;
  --ux-ink:#F4F0E8;
  --ux-ink-2:rgba(244,240,232,.68);
  --ux-ink-3:rgba(244,240,232,.42);
  --ux-line:rgba(255,255,255,.08);
  --ux-line-2:rgba(255,255,255,.16);
  --ux-accent:#B7A4FF;
  --ux-accent-2:#7DB4FF;
  --ux-accent-soft:rgba(183,164,255,.15);
  --ux-accent-ink:#0B0C12;
  --ux-mint:#7EE8C0;
  --ux-warn:#FFB26B;
  --ux-danger:#FF7D8C;
  --ux-glass:rgba(255,255,255,.07);
  --ux-glass-line:rgba(255,255,255,.18);
  --ux-shadow:rgba(0,0,0,.45);
  --ux-shadow-strong:rgba(0,0,0,.72);
  --ux-grad:linear-gradient(120deg,#B7A4FF,#7DB4FF 55%,#A5F2D3);
}
/* 요소 공통 베이스 — 루트에 .ux 클래스를 붙입니다 */
.ux,.ux *,.ux *::before,.ux *::after{box-sizing:border-box}
.ux{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--ux-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  -webkit-tap-highlight-color:transparent;
  word-break:keep-all;overflow-wrap:break-word;
}
/* :where()로 명시도를 0으로 둬서, 요소 클래스가 버튼·입력의 색과 글꼴을 덮어쓸 수 있게 합니다 */
:where(.ux) :is(button,input,textarea,select){font:inherit;color:inherit}
:where(.ux) button{cursor:pointer}
.ux :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}
.ux [hidden]{display:none!important}
/* 모션 줄이기: 전환은 즉시 끝나고, 무한 반복은 한 번으로 줄여 최종 상태가 보이게 합니다 */
@media (prefers-reduced-motion:reduce){
  .ux,.ux *,.ux *::before,.ux *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}

html,body{margin:0;min-height:100%;background:var(--ux-page);}
body{display:grid;place-items:center;padding:28px 16px;}

<body class="ux">
<!-- @meta {"title": "문서 찾기·바꾸기", "category": "문서·데이터 편집", "summary": "본문에서 찾을 단어를 강조하고 한 번에 바꾸는 찾기·바꾸기 창입니다. 단어를 입력하면 일치한 곳이 바로 표시되고, 모두 바꾸기로 한꺼번에 고칩니다.", "hint": "찾을 단어와 바꿀 단어를 입력한 뒤 ‘모두 바꾸기’를 눌러 보세요", "shape": "square", "fluid": true, "hue": "#3A6AAB", "hue2": "#22C3A6", "tags": ["document-replace", "editing", "interactive"]} -->
<!-- @demo [["wait", 800], ["tap", ".u128 [data-apply]", 0], ["wait", 1800], ["reset"]] -->
<!-- @en {"title": "Find and replace", "summary": "A find-and-replace panel that highlights matches in the text and changes them all at once. Type a word and its matches light up; Replace all fixes every one.", "hint": "Type what to find and what to replace it with, then press “Replace all”","map":[
  ["작은 정원에 햇빛이 들었다.\\n우리는 정원에서 새 잎을 찾았다.\\n내일도 정원을 돌볼 것이다.", "Sunlight reached the small garden.\\nWe found new leaves in the garden.\\nWe will tend the garden again tomorrow."],
  ["정원", "garden"],
  ["숲", "forest"],
  ["찾을 단어", "Find"],
  ["바꿀 단어", "Replace with"],
  ["모두 바꾸기", "Replace all"],
  ["편집 문서", "Document being edited"],
  ["count+'개 일치'", "count+(count===1?' match':' matches')"],
  ["count+'개 바꿈'", "count+' replaced'"]

<style>
.u128{width:min(100%,370px);font-size:14px;line-height:1.6;color:var(--ux-ink)}.u128 button,.u128 input,.u128 textarea,.u128 select{font:inherit;color:inherit;max-width:100%;min-width:0}.u128 button{cursor:pointer;min-height:44px;border:1px solid var(--ux-line-2);border-radius:8px;background:var(--ux-surface);padding:8px 12px}.u128 input,.u128 textarea,.u128 select{border:1px solid var(--ux-line-2);border-radius:6px;background:var(--ux-surface);padding:8px 10px}.u128 .quiet{color:var(--ux-ink-2)}.u128 .primary{background:var(--ux-accent);color:var(--ux-accent-ink);border-color:transparent}.u128 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.u128 [hidden]{display:none!important}.u128 :focus-visible{outline:2px solid var(--ux-accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){.u128 *{animation:none!important;transition:none!important}}
.u128{background:var(--ux-surface);border-radius:2px;padding:21px 23px 25px;border-top:2px solid var(--ux-accent);box-shadow:0 8px 18px var(--ux-shadow)}.u128 .search{display:grid;grid-template-columns:1fr 15px 1fr 44px;gap:6px;align-items:center}.u128 .search input{width:100%;font-size:14px;border:0;border-bottom:1px solid var(--ux-line-2);border-radius:0;padding:8px 2px;background:transparent}.u128 [data-apply]{padding:6px;min-width:44px}.u128 .paper{font:17px/2.1 Georgia,'Apple SD Gothic Neo',serif;padding-top:26px;white-space:pre-wrap}.u128 mark{background:color-mix(in srgb,var(--ux-warn) 24%,transparent);color:inherit;border-radius:2px}.u128 [data-apply]:disabled{opacity:.5}
</style>
<div class="ux u128"><div class="search"><input data-find value="정원" aria-label="찾을 단어"><span class="quiet" aria-hidden="true">→</span><input data-replace value="숲" aria-label="바꿀 단어"><button class="primary" data-apply aria-label="모두 바꾸기">↵</button></div><div class="paper" aria-label="편집 문서"></div><span class="sr" data-state aria-live="polite"></span></div>
<script>
(()=>{const root=document.currentScript.previousElementSibling,$=s=>root.querySelector(s),$$=s=>[...root.querySelectorAll(s)],esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const motion=(node,frames,opts={})=>{if(node?.animate&&!matchMedia('(prefers-reduced-motion:reduce)').matches)node.animate(frames,{duration:220,easing:'cubic-bezier(.2,.8,.2,1)',...opts})};let text='작은 정원에 햇빛이 들었다.\n우리는 정원에서 새 잎을 찾았다.\n내일도 정원을 돌볼 것이다.';function render(){const q=$('[data-find]').value,count=q?text.split(q).length-1:0;$('.paper').innerHTML=q?text.split(q).map(esc).join('<mark>'+esc(q)+'</mark>'):esc(text);$('[data-apply]').disabled=!count;$('[data-state]').textContent=count+'개 일치'}$$('input').forEach(i=>i.oninput=render);$('[data-apply]').onclick=()=>{const q=$('[data-find]').value,count=text.split(q).length-1;text=text.split(q).join($('[data-replace]').value);render();$('[data-state]').textContent=count+'개 바꿈';motion($('.paper'),[{opacity:.65},{opacity:1}])};render();})();
</script>
